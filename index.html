<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DMX OMNI V100 - 100% STABLE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

    <script type="module">
        import { createAppKit } from 'https://esm.sh/@reown/appkit?bundle'
        import { Ethers5Adapter } from 'https://esm.sh/@reown/appkit-adapter-ethers5?bundle'
        import { bsc } from 'https://esm.sh/@reown/appkit/networks?bundle'

        const projectId = '059cc242b0cc96ac9665c598b76ddc7b';
        const modal = createAppKit({
          adapters: [new Ethers5Adapter()],
          networks: [bsc],
          metadata: { name: 'DimeX Pro', url: window.location.origin, icons: ['https://i.ibb.co/HpqwGFqt/logo.png'] },
          projectId,
          features: { analytics: true }
        });
        window.appKitModal = modal;
        modal.subscribeState(state => { if(state.isConnected) window.syncWallet(); });
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        :root { --p: #bc13fe; --a: #00f2ff; --bg: #03010f; }
        body { background: var(--bg); color: #fff; font-family: 'Orbitron', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .glass-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(188, 19, 254, 0.2); border-radius: 24px; backdrop-filter: blur(20px); }
        .btn-dmx { background: linear-gradient(135deg, var(--p), #6d28d9); border-radius: 14px; font-weight: 900; color: white; border: none; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(188, 19, 254, 0.4); }
        .btn-dmx:hover { transform: scale(1.03); box-shadow: 0 0 30px var(--p); }
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 75vh; overflow-y: auto; }
        .active-bet { border-color: var(--a) !important; color: var(--a); box-shadow: 0 0 15px var(--a); }
        .flash-win { animation: winFlash 0.5s; }
        @keyframes winFlash { 0%, 100% { background: transparent; } 50% { background: #064e3b; } }
        .slot-reel { width: 80px; height: 120px; background: #000; border: 2px solid #333; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
        .crash-boom { animation: boom 0.3s forwards; }
        @keyframes boom { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(4); opacity: 0; filter: hue-rotate(90deg); } }
    </style>
</head>
<body onclick="initAudio()">

    <header class="max-w-7xl mx-auto flex justify-between items-center p-6">
        <div>
            <h1 class="text-3xl font-black italic text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400">DMX OMNI V100</h1>
            <div class="flex gap-4 text-[9px] uppercase font-bold mt-1">
                <span class="text-slate-500">Pancake: <span id="liveRate" class="text-white">Fetching...</span></span>
                <span class="text-slate-500">Manual: <span id="manualRateDisplay" class="text-cyan-400">0.0135</span></span>
            </div>
        </div>
        <div class="flex gap-4 items-center">
            <div class="glass-card px-8 py-3 flex flex-col items-center border-cyan-500/30">
                <span class="text-[8px] text-slate-500 uppercase">Balance</span>
                <span class="text-cyan-400 font-black text-xl" id="bal">1000.00 DMX</span>
            </div>
            <button onclick="window.appKitModal.open()" class="btn-dmx px-8 py-3 text-[10px] uppercase italic">Connect Wallet</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 px-6">
        <div class="lg:col-span-3 space-y-4">
            <section class="glass-card p-6">
                <label class="text-[10px] text-slate-500 uppercase font-black block mb-2">Bet Amount</label>
                <input id="betVal" type="number" value="100" min="100" class="w-full bg-black/60 border border-white/10 p-4 rounded-xl text-center text-xl font-black text-cyan-400 outline-none">
                <div class="grid grid-cols-2 gap-2 mt-4">
                    <button onclick="openPortal('dep')" class="btn-dmx py-3 text-[10px] uppercase">Deposit</button>
                    <button onclick="openPortal('with')" class="bg-white/5 py-3 rounded-xl text-[10px] uppercase font-bold">Withdraw</button>
                </div>
            </section>

            <section class="glass-card p-5">
                <p class="text-[9px] text-purple-400 uppercase font-black mb-2 italic">Referral Reward (5%)</p>
                <div id="refLink" class="text-[8px] text-slate-500 bg-black/40 p-2 rounded mb-2 break-all italic">Connect for link</div>
                <button onclick="claimRef()" class="w-full py-2 bg-green-500/20 text-green-400 text-[9px] font-black uppercase rounded">Claim: <span id="refBal">0.00</span> DMX</button>
            </section>
        </div>

        <div class="lg:col-span-9 glass-card p-6 relative min-h-[70vh]">
            <div id="lobby" class="grid grid-cols-2 md:grid-cols-3 gap-6">
                <div onclick="showGame('coin')" class="glass-card p-10 text-center cursor-pointer hover:border-cyan-400 transition group">
                    <span class="text-7xl group-hover:scale-110 block">🪙</span><p class="mt-4 text-[10px] font-black uppercase">Coin Flip</p>
                </div>
                <div onclick="showGame('dice')" class="glass-card p-10 text-center cursor-pointer hover:border-cyan-400 transition group">
                    <span class="text-7xl group-hover:scale-110 block">🎲</span><p class="mt-4 text-[10px] font-black uppercase">3D Dice</p>
                </div>
                <div onclick="showGame('crash')" class="glass-card p-10 text-center cursor-pointer hover:border-cyan-400 transition group">
                    <span class="text-7xl group-hover:scale-110 block">🚀</span><p class="mt-4 text-[10px] font-black uppercase">Crash Moon</p>
                </div>
                <div onclick="showGame('slot')" class="glass-card p-10 text-center cursor-pointer hover:border-cyan-400 transition group">
                    <span class="text-7xl group-hover:scale-110 block">🎰</span><p class="mt-4 text-[10px] font-black uppercase">Elite Slots</p>
                </div>
                <div onclick="showGame('warrior')" class="glass-card p-10 text-center cursor-pointer hover:border-cyan-400 transition group">
                    <span class="text-7xl group-hover:scale-110 block">⚔️</span><p class="mt-4 text-[10px] font-black uppercase">Warrior Fight</p>
                </div>
            </div>

            <div id="coinView" class="screen">
                <div id="coin3D" class="w-64 h-64 mb-6"></div>
                <div class="flex gap-4 mb-8">
                    <button onclick="selectBet('heads', this)" class="glass-card px-12 py-5 font-black uppercase">Heads</button>
                    <button onclick="selectBet('tails', this)" class="glass-card px-12 py-5 font-black uppercase">Tails</button>
                </div>
                <button onclick="runCoin()" class="btn-dmx w-full max-sm py-6 uppercase font-black italic text-xl">Flip Coin</button>
            </div>

            <div id="diceView" class="screen">
                <div id="dice3D" class="w-64 h-64 mb-6"></div>
                <div class="grid grid-cols-6 gap-2 mb-8 w-full max-w-md">
                    <button onclick="selectBet(1, this)" class="glass-card p-4 font-black">1</button>
                    <button onclick="selectBet(2, this)" class="glass-card p-4 font-black">2</button>
                    <button onclick="selectBet(3, this)" class="glass-card p-4 font-black">3</button>
                    <button onclick="selectBet(4, this)" class="glass-card p-4 font-black">4</button>
                    <button onclick="selectBet(5, this)" class="glass-card p-4 font-black">5</button>
                    <button onclick="selectBet(6, this)" class="glass-card p-4 font-black">6</button>
                </div>
                <button onclick="runDice()" class="btn-dmx w-full max-w-sm py-6 uppercase font-black italic text-xl">Roll 3D Dice</button>
            </div>

            <div id="crashView" class="screen">
                <div class="w-full h-64 relative bg-black/40 rounded-3xl border border-white/5 overflow-hidden mb-6">
                    <h2 id="crashMult" class="absolute top-10 left-10 text-7xl font-black italic text-cyan-400">1.00x</h2>
                    <div id="rocket" class="absolute bottom-6 left-6 text-7xl">🚀</div>
                </div>
                <button id="crashBtn" onclick="runCrash()" class="btn-dmx w-full max-w-sm py-6 uppercase font-black">Launch</button>
            </div>

            <div id="slotView" class="screen">
                <div class="flex gap-4 my-12">
                    <div id="s1" class="slot-reel">💎</div>
                    <div id="s2" class="slot-reel">💎</div>
                    <div id="s3" class="slot-reel">💎</div>
                </div>
                <button onclick="runSlots()" class="btn-dmx w-full max-w-sm py-6 uppercase font-black">Spin</button>
            </div>

            <div id="warriorView" class="screen">
                <div class="flex items-center gap-12 my-12">
                    <div onclick="selectBet('w1', this)" id="war1" class="glass-card p-10 text-8xl transition-all">🛡️</div>
                    <span class="text-4xl italic font-black text-red-500 animate-pulse">VS</span>
                    <div onclick="selectBet('w2', this)" id="war2" class="glass-card p-10 text-8xl transition-all">⚔️</div>
                </div>
                <button onclick="runWarrior()" class="btn-dmx w-full max-w-sm py-6 uppercase font-black">Start Battle</button>
            </div>

            <button onclick="backToLobby()" id="backBtn" class="hidden absolute top-4 left-4 text-[10px] opacity-40 hover:opacity-100 uppercase italic">← Back to Lobby</button>
        </div>
    </main>

    <div id="portal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-xl z-[100] flex items-center justify-center p-6">
        <div class="glass-card w-full max-w-md p-8 border-cyan-400/30">
            <h2 id="pTitle" class="text-2xl font-black uppercase text-cyan-400 mb-6 italic">Portal</h2>
            <div id="pBody" class="space-y-4"></div>
            <button onclick="closePortal()" class="w-full mt-8 bg-white/5 p-4 rounded-xl text-[10px] uppercase font-bold">Close</button>
        </div>
    </div>

    <script>
        let balance = 1000.0, refBal = 0.0, playing = false, selectedBet = null, manualRate = 0.0135, payMode = 'DMX';
        let sceneC, sceneD, coinMesh, diceMesh, rendererC, rendererD;

        // --- NEW UPDATED FUNCTIONS START ---
        
        // 1. Live Pancake Rate Fetcher
        async function updateLiveRate() {
            try {
                // Fetching DMX price from a public API (Example using PancakeSwap pair logic or generic price API)
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=binancecoin&vs_currencies=usd');
                const data = await res.json();
                // Simulation of DMX/USD rate based on manual offset for demo
                document.getElementById('liveRate').innerText = manualRate.toFixed(4);
            } catch (e) {
                document.getElementById('liveRate').innerText = "0.0135";
            }
        }

        // 2. Referral Claim Function
        function claimRef() {
            if (refBal > 0) {
                balance += refBal;
                alert(`Successfully claimed ${refBal.toFixed(2)} DMX Referral Reward!`);
                refBal = 0;
                updateUI();
            } else {
                alert("No referral balance to claim.");
            }
        }

        // 3. Wallet Sync & Referral Link Generation
        window.syncWallet = function() {
            const addr = window.appKitModal.getAddress();
            if(addr) {
                const shortAddr = addr.substring(0, 6) + "..." + addr.substring(addr.length - 4);
                document.getElementById('refLink').innerText = window.location.origin + "?ref=" + shortAddr;
                console.log("Wallet Synced:", addr);
            }
        }

        // --- NEW UPDATED FUNCTIONS END ---

        const sfx = {
            bg: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-tech-house-vibe-10.mp3'], loop:true, volume:0.1 }),
            win: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-fireworks-suburban-sky-2035.mp3'] }),
            lose: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3'] }),
            action: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-spinning-coin-win-notification-1991.mp3'] }),
            boom: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-explosion-with-debris-2188.mp3'] })
        };

        function initAudio() { if(!sfx.bg.playing()) sfx.bg.play(); }

        function updateUI() {
            document.getElementById('bal').innerText = balance.toFixed(2) + " DMX";
            document.getElementById('refBal').innerText = refBal.toFixed(2);
        }

        // 3D Initialization (Unchanged)
        function createDiceTexture(number) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white'; ctx.fillRect(0,0,128,128);
            ctx.fillStyle = 'black'; ctx.font = 'bold 80px Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(number, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        function init3D() {
            sceneC = new THREE.Scene(); rendererC = new THREE.WebGLRenderer({alpha:true, antialias:true});
            rendererC.setSize(250, 250); document.getElementById('coin3D').appendChild(rendererC.domElement);
            coinMesh = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.3, 64), [
                new THREE.MeshStandardMaterial({color: 0x8a6d3b}),
                new THREE.MeshStandardMaterial({color: 0xffd700, metalness:0.9}),
                new THREE.MeshStandardMaterial({color: 0xffd700, metalness:0.9})
            ]);
            coinMesh.rotation.x = Math.PI/2; sceneC.add(new THREE.AmbientLight(0xffffff, 2), coinMesh);

            sceneD = new THREE.Scene(); rendererD = new THREE.WebGLRenderer({alpha:true, antialias:true});
            rendererD.setSize(250, 250); document.getElementById('dice3D').appendChild(rendererD.domElement);
            const materials = [1,2,3,4,5,6].map(i => new THREE.MeshStandardMaterial({map: createDiceTexture(i)}));
            diceMesh = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.2, 2.2), materials);
            sceneD.add(new THREE.AmbientLight(0xffffff, 2), diceMesh);

            const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 100); cam.position.z = 8;
            function anim() { requestAnimationFrame(anim); if(!playing){ coinMesh.rotation.z+=0.01; diceMesh.rotation.y+=0.01; } rendererC.render(sceneC, cam); rendererD.render(sceneD, cam); }
            anim();
        }

        function finalize(win, mult, bet) {
            playing = false;
            if(win) {
                let winAmt = bet * mult; balance += winAmt; refBal += (winAmt * 0.05);
                sfx.win.play(); document.body.classList.add('flash-win');
                setTimeout(() => document.body.classList.remove('flash-win'), 500);
            } else { sfx.lose.play(); }
            updateUI();
        }

        // Game runners (Unchanged)
        function runCoin() {
            let b = getBet(); if(!b || !selectedBet) return alert("Select Bet & Amount!");
            playing = true; sfx.action.play();
            const win = Math.random() < 0.48;
            gsap.to(coinMesh.rotation, { y: coinMesh.rotation.y + Math.PI*10, duration: 2, onComplete: () => finalize(win, 1.95, b)});
        }

        function runDice() {
            let b = getBet(); if(!b || !selectedBet) return alert("Select Number!");
            playing = true; sfx.action.play();
            const res = Math.floor(Math.random()*6)+1;
            const rotations = {1:[0,0], 2:[0,Math.PI/2], 3:[0,Math.PI], 4:[0,-Math.PI/2], 5:[Math.PI/2,0], 6:[-Math.PI/2,0]};
            gsap.to(diceMesh.rotation, { x: Math.PI*8 + rotations[res][0], y: Math.PI*8 + rotations[res][1], duration: 2, onComplete: () => finalize(selectedBet==res, 5.5, b)});
        }

        function runCrash() {
            let b = getBet(); if(!b) return; playing = true; sfx.action.play();
            let m = 1.0; let rocket = document.getElementById('rocket');
            let crashPoint = 1.1 + Math.random() * 3.5;
            let timer = setInterval(() => {
                m += 0.02; document.getElementById('crashMult').innerText = m.toFixed(2)+'x';
                gsap.set(rocket, { x: (m-1)*60, y: -(m-1)*30 });
                if(m >= crashPoint) { 
                    clearInterval(timer); sfx.boom.play();
                    rocket.classList.add('crash-boom');
                    setTimeout(() => { rocket.classList.remove('crash-boom'); gsap.set(rocket, {x:0, y:0}); }, 500);
                    finalize(false, 0, b); document.getElementById('crashMult').innerText = 'BOOM!'; 
                }
            }, 50);
            document.getElementById('crashBtn').innerText = "CASH OUT";
            document.getElementById('crashBtn').onclick = () => { 
                clearInterval(timer); finalize(true, m, b); 
                document.getElementById('crashBtn').innerText = "LAUNCH";
                document.getElementById('crashBtn').onclick = runCrash;
            };
        }

        function runSlots() {
            let b = getBet(); if(!b) return; playing = true; sfx.action.play();
            const items = ['💎','🍒','7️⃣','🔔','🍀'];
            gsap.to(".slot-reel", { y: 20, repeat: 10, yoyo: true, duration: 0.05, onComplete: () => {
                let r = [items[Math.floor(Math.random()*5)], items[Math.floor(Math.random()*5)], items[Math.floor(Math.random()*5)]];
                document.getElementById('s1').innerText = r[0]; document.getElementById('s2').innerText = r[1]; document.getElementById('s3').innerText = r[2];
                finalize(r[0]==r[1] && r[1]==r[2], 10, b);
            }});
        }

        function runWarrior() {
            let b = getBet(); if(!b || !selectedBet) return alert("Pick Warrior!");
            playing = true; sfx.action.play();
            gsap.to("#war1, #war2", { x: 30, repeat: 10, yoyo: true, duration: 0.05, onComplete: () => finalize(Math.random()<0.48, 2, b)});
        }

        function openPortal(mode) {
            document.getElementById('portal').classList.remove('hidden');
            let body = document.getElementById('pBody');
            if(mode === 'dep') {
                document.getElementById('pTitle').innerText = "Deposit Funds";
                body.innerHTML = `
                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <button id="dmxBtn" onclick="setMode('DMX')" class="bg-purple-600 p-3 rounded-lg font-bold">DMX Mode</button>
                        <button id="usdtBtn" onclick="setMode('USDT')" class="bg-white/5 p-3 rounded-lg font-bold">USDT Mode</button>
                    </div>
                    <input type="number" id="amtIn" oninput="calcDep()" class="w-full bg-black p-4 rounded-xl border border-white/10 text-center" placeholder="Enter Amount">
                    <div class="p-4 bg-cyan-500/10 rounded-xl text-center">
                        <p class="text-[10px] text-slate-400">YOU RECEIVE</p>
                        <h3 class="text-2xl font-black text-cyan-400"><span id="receiveAmt">0.00</span> DMX</h3>
                    </div>
                    <div class="text-[9px] text-slate-500 break-all p-3 bg-black/40 rounded border border-white/5">
                        Address: 0x742d35Cc6634C0532925a3b844Bc454e4438f44e
                    </div>
                    <button onclick="mockCredit()" class="w-full btn-dmx py-3 mt-2 uppercase">Submit Payment</button>
                `;
            } else {
                document.getElementById('pTitle').innerText = "Withdraw DMX";
                body.innerHTML = `
                    <input type="number" id="withAmt" class="w-full bg-black p-4 rounded-xl border border-white/10 text-center" placeholder="DMX Amount">
                    <button onclick="mockWithdraw()" class="w-full btn-dmx py-3 mt-4">Withdraw Now</button>
                `;
            }
        }

        function setMode(m) { 
            payMode = m; 
            document.getElementById('dmxBtn').className = m=='DMX'?'bg-purple-600 p-3 rounded-lg font-bold':'bg-white/5 p-3 rounded-lg font-bold';
            document.getElementById('usdtBtn').className = m=='USDT'?'bg-purple-600 p-3 rounded-lg font-bold':'bg-white/5 p-3 rounded-lg font-bold';
            calcDep();
        }

        function calcDep() {
            let val = parseFloat(document.getElementById('amtIn').value) || 0;
            let result = (payMode === 'USDT') ? (val / manualRate) : val;
            document.getElementById('receiveAmt').innerText = result.toFixed(2);
        }

        function mockCredit() {
            let amt = parseFloat(document.getElementById('receiveAmt').innerText);
            if(amt > 0) { balance += amt; updateUI(); closePortal(); alert("Deposit Credited Successfully!"); }
        }

        function mockWithdraw() {
            let amt = parseFloat(document.getElementById('withAmt').value);
            if(amt > 0 && balance >= amt) { balance -= amt; updateUI(); closePortal(); alert("Withdrawal Requested!"); }
            else { alert("Invalid Amount!"); }
        }

        function closePortal() { document.getElementById('portal').classList.add('hidden'); }
        function getBet() { let v = parseFloat(document.getElementById('betVal').value); if(balance >= v && v >= 100) { balance -= v; updateUI(); return v; } return 0; }
        function showGame(g) { document.getElementById('lobby').style.display='none'; document.getElementById(g+'View').style.display='flex'; document.getElementById('backBtn').classList.remove('hidden'); }
        function backToLobby() { document.querySelectorAll('.screen').forEach(s=>s.style.display='none'); document.getElementById('lobby').style.display='grid'; document.getElementById('backBtn').classList.add('hidden'); selectedBet=null; }
        function selectBet(v, el) { selectedBet = v; document.querySelectorAll('.active-bet, .glass-card').forEach(b=>b.classList.remove('active-bet')); el.classList.add('active-bet'); }
        
        window.onload = () => { 
            init3D(); 
            updateUI();
            updateLiveRate();
            setInterval(updateLiveRate, 30000); // Update price every 30 seconds
        };
    </script>
</body>
</html>
