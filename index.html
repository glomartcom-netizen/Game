<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DMX ELITE - V19.4 HYPER-DRIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script type="module">
        import { createAppKit } from 'https://esm.sh/@reown/appkit?bundle'
        import { Ethers5Adapter } from 'https://esm.sh/@reown/appkit-adapter-ethers5?bundle'
        import { bsc } from 'https://esm.sh/@reown/appkit/networks?bundle'

        const projectId = '059cc242b0cc96ac9665c598b76ddc7b';

        const modal = createAppKit({
          adapters: [new Ethers5Adapter()],
          networks: [bsc],
          metadata: { 
            name: 'DimeX Pro', 
            url: window.location.origin, 
            icons: ['https://i.ibb.co/HpqwGFqt/logo.png'] 
          },
          projectId,
          features: { analytics: true }
        });

        window.appKitModal = modal;

        modal.subscribeState((state) => {
          if(state?.isConnected && window.syncWallet) window.syncWallet();
        });

        window.addEventListener("load", () => {  
            let retry = 0;  
            const reconnect = setInterval(() => {  
                if(modal.getWalletProvider()){  
                    if(window.syncWallet) window.syncWallet();  
                    clearInterval(reconnect);  
                }  
                if(++retry >= 10) clearInterval(reconnect);  
            }, 1000);  
        });
    </script>

    <style>
        :root { --primary: #6366f1; --dark: #020617; --gold: #f59e0b; }
        body { background: var(--dark); color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        .master-card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 1.2rem; }
        .btn-master { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); font-weight: 800; transition: 0.3s; text-transform: uppercase; border-radius: 0.75rem; }
        .btn-master:active { transform: scale(0.95); }
        .active-selection { border: 2px solid #6366f1 !important; background: rgba(99, 102, 241, 0.2) !important; }
        .reel-blur { filter: blur(6px); transition: filter 0.2s; }
        .glow-active { text-shadow: 0 0 20px var(--primary), 0 0 40px var(--primary); animation: pulse-glow 0.8s infinite; }
        @keyframes pulse-glow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .shake-heavy { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 2px, 0); } 20%, 80% { transform: translate3d(4px, -4px, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 6px, 0); } 40%, 60% { transform: translate3d(6px, -6px, 0); } }
        #winOverlay { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 50; background: radial-gradient(circle, rgba(245, 158, 11, 0.3) 0%, transparent 70%); }
        .slot-window { display: flex; gap: 5px; justify-content: center; background: #000; padding: 10px; border-radius: 1rem; height: 100px; border: 1px solid #1e293b; overflow: hidden; }
        .reel-hd { width: 60px; height: 80px; overflow: hidden; position: relative; background: #0a0a0a; border-radius: 8px; }
        .symbol-hd { height: 80px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        #liveFeed::-webkit-scrollbar { width: 2px; }
    </style>
</head>
<body id="mainBody" class="p-2 md:p-4">
    <div id="winOverlay"></div>

    <header class="max-w-7xl mx-auto mb-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black italic tracking-tighter text-white">DMX <span class="text-indigo-500">V19.4</span></h1>
            <p class="text-[9px] text-slate-500 uppercase font-bold">Protocol: <span id="uiRate" class="text-indigo-400">---</span> DMX/USDT</p>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleAmbience()" id="muteBtn" class="master-card px-3 py-1 text-[10px] text-slate-400 border border-white/10">🔈 OFF</button>
            <div class="master-card px-4 py-1 text-right">
                <div id="refEarnings" class="text-[9px] text-green-500 font-bold">INVITER: NONE</div>
                <div id="dmxGame" class="text-xs font-bold text-indigo-400">500.00 DMX</div>
            </div>
            <button onclick="window.appKitModal.open()" id="connectBtn" class="btn-master px-4 py-2 text-[10px]">CONNECT WALLET</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-4 h-[78vh]">
        <div class="lg:col-span-3 space-y-4 flex flex-col">
            <section class="master-card p-4">
                <div class="flex justify-between text-[10px] font-bold text-slate-500 uppercase mb-2">
                    <span>Bet</span>
                    <span id="betValue" class="text-indigo-400">10 DMX</span>
                </div>
                <input id="betAmount" type="range" min="1" max="1000" value="10" oninput="updateUI()" class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer mb-4">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="handleDeposit()" class="bg-green-600/20 border border-green-500/50 p-2 rounded-lg text-[10px] font-bold">DEPOSIT</button>
                    <button onclick="handleWithdraw()" class="bg-indigo-600/20 border border-indigo-500/50 p-2 rounded-lg text-[10px] font-bold">WITHDRAW</button>
                </div>
            </section>

            <section class="master-card p-4 bg-indigo-900/10 border-indigo-500/20">
                <h3 class="text-[10px] font-black text-indigo-400 mb-2 uppercase">Referral Link</h3>
                <div class="bg-black/40 p-2 rounded border border-white/5 mb-2 overflow-hidden">
                    <p id="refLinkDisplay" class="text-[9px] font-mono truncate text-indigo-300 italic">Connect wallet...</p>
                </div>
                <button onclick="copyRef()" class="w-full py-1.5 bg-indigo-600/20 border border-indigo-500/40 rounded text-[9px] font-bold uppercase">Copy Link</button>
            </section>

            <section class="master-card p-4 flex-1 overflow-hidden flex flex-col">
                <p class="text-[10px] font-bold text-indigo-500 uppercase mb-2">System Logs</p>
                <div id="liveFeed" class="flex-1 overflow-y-auto space-y-1 text-[9px] font-mono"></div>
            </section>
        </div>

        <div class="lg:col-span-9 grid grid-cols-1 md:grid-cols-2 gap-4 overflow-y-auto pb-10 pr-1">
            <section class="master-card p-4 flex flex-col items-center">
                <div id="battleDisplay" class="flex justify-around items-center w-full h-28 bg-black/60 rounded-xl mb-4">
                    <div id="p1" class="text-5xl">⚔️</div>
                    <div class="text-indigo-600 font-black animate-pulse text-xs">VS</div>
                    <div id="p2" class="text-5xl">🛡️</div>
                </div>
                <div class="flex gap-2 w-full mb-3">
                    <button onclick="setSide('battle', 0)" id="battle0" class="flex-1 py-2 master-card active-selection text-[10px]">WARRIOR</button>
                    <button onclick="setSide('battle', 1)" id="battle1" class="flex-1 py-2 master-card text-[10px]">PALADIN</button>
                </div>
                <button onclick="playGame('battle')" class="btn-master w-full py-3 text-xs">Begin Battle</button>
            </section>

            <section class="master-card p-4 flex flex-col items-center">
                <div id="coinCanvas" class="w-full h-28"></div>
                <div class="flex gap-2 w-full mb-3">
                    <button onclick="setSide('coin', 0)" id="coin0" class="flex-1 py-2 master-card active-selection text-[10px]">HEADS</button>
                    <button onclick="setSide('coin', 1)" id="coin1" class="flex-1 py-2 master-card text-[10px]">TAILS</button>
                </div>
                <button onclick="playGame('coin')" class="btn-master w-full py-3 text-xs">Flip 3D Coin</button>
            </section>

            <section class="master-card p-4 md:col-span-1">
                <div class="slot-window mb-4">
                    <div class="reel-hd"><div id="reel1" class="absolute w-full"></div></div>
                    <div class="reel-hd"><div id="reel2" class="absolute w-full"></div></div>
                    <div class="reel-hd"><div id="reel3" class="absolute w-full"></div></div>
                </div>
                <button onclick="playGame('slot')" id="slotBtn" class="btn-master w-full py-4 text-sm tracking-widest">SPIN REELS</button>
            </section>

            <section id="crashCard" class="master-card p-4 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="crashMult" class="text-4xl font-black text-indigo-400">1.00x</h3>
                    <div id="rocket" class="text-4xl transform">🚀</div>
                </div>
                <div class="h-1 bg-slate-800 w-full rounded-full mb-6">
                    <div id="crashBar" class="h-full bg-indigo-500 w-0"></div>
                </div>
                <div class="flex gap-2">
                    <button onclick="playGame('crash')" id="crashBtn" class="btn-master flex-1 py-4 text-xs">TAKE OFF</button>
                    <button onclick="cashoutCrash()" id="cashoutBtn" class="hidden flex-1 py-4 bg-green-600 rounded-xl font-black text-xs text-white uppercase">CASHOUT</button>
                </div>
            </section>

            <section class="master-card p-4 flex flex-col items-center md:col-span-2">
                <div id="diceCanvas" class="w-full h-28 mb-2"></div>
                <div class="grid grid-cols-6 gap-1 w-full mb-3">
                    <button onclick="setSide('dice', 1)" id="dice1" class="py-2 master-card active-selection text-[10px]">1</button>
                    <button onclick="setSide('dice', 2)" id="dice2" class="py-2 master-card text-[10px]">2</button>
                    <button onclick="setSide('dice', 3)" id="dice3" class="py-2 master-card text-[10px]">3</button>
                    <button onclick="setSide('dice', 4)" id="dice4" class="py-2 master-card text-[10px]">4</button>
                    <button onclick="setSide('dice', 5)" id="dice5" class="py-2 master-card text-[10px]">5</button>
                    <button onclick="setSide('dice', 6)" id="dice6" class="py-2 master-card text-[10px]">6</button>
                </div>
                <button onclick="playGame('dice')" class="btn-master w-full py-3 text-xs">Roll 3D Dice</button>
            </section>
        </div>
    </main>

    <script>
        const DMX_TOKEN = "0xYourDmxAddress"; 
        const ADMIN_API = "https://your-backend.com/api/dmx-rate"; // UPDATE THIS TO YOUR REAL URL
        
        let dmxBalance = 500, USDT_TO_DMX_RATE = 100, manualRate = null;
        let isPlaying = false, selectedSides = {coin:0, dice:1, battle:0}, ambienceOn = false;
        let coinMesh, diceMesh, crashVal, crashInt, inviter = null, userWallet = null;

        const sounds = {
            win: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-casino-bling-notification-229.mp3'] }),
            lose: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3'], volume: 0.2 }),
            spin: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-mechanical-spin-wheel-click-1139.mp3'], loop: true }),
            boom: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-explosive-impact-boom-2580.mp3'] }),
            casino: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-casino-slot-machine-room-ambience-1982.mp3'], loop: true, volume: 0.1 })
        };

        // --- PROTOCOL: ADMIN ORACLE & FALLBACK ---
        async function fetchOracle() {
            try {
                // REAL API CONNECTION
                const adminResponse = await fetch(ADMIN_API).catch(() => null);
                if(adminResponse && adminResponse.ok) {
                    const adminData = await adminResponse.json();
                    if(adminData.manualMode) {
                        manualRate = adminData.rate;
                        USDT_TO_DMX_RATE = manualRate;
                        document.getElementById('uiRate').innerText = USDT_TO_DMX_RATE;
                        return; // Exit early if admin rate is set
                    }
                }

                // Fallback to Live Dex
                const res = await fetch(`https://api.geckoterminal.com/api/v2/networks/bsc/pools/${DMX_TOKEN}`);
                const data = await res.json();
                const price = parseFloat(data.data?.attributes?.base_token_price_usd) || 0.01;
                USDT_TO_DMX_RATE = Math.floor(1 / price);
            } catch(e) { 
                if(!manualRate) USDT_TO_DMX_RATE = 100; 
            }
            document.getElementById('uiRate').innerText = USDT_TO_DMX_RATE;
        }

        window.syncWallet = async function() {
            const provider = window.appKitModal.getWalletProvider();
            if(!provider) return;
            const ethersProvider = new ethers.BrowserProvider(provider);
            const signer = await ethersProvider.getSigner();
            userWallet = await signer.getAddress();
            document.getElementById('connectBtn').innerText = userWallet.substring(0,6)+"..."+userWallet.substring(38);
            document.getElementById('refLinkDisplay').innerText = window.location.origin + window.location.pathname + "?ref=" + userWallet;
            checkReferral();
        }

        function checkReferral() {
            const params = new URLSearchParams(window.location.search);
            const ref = params.get('ref');
            if (ref && ref.toLowerCase() !== userWallet?.toLowerCase()) {
                inviter = ref;
                document.getElementById('refEarnings').innerText = "INVITER: " + ref.substring(0,6) + "...";
            }
        }

        function handleDeposit() {
            const raw = prompt("Enter USDT amount:");
            const amt = parseFloat(raw);
            if(isNaN(amt) || amt <= 0 || amt > 100000) return;
            addLog(`Verifying Payment...`, "text-slate-500");
            setTimeout(() => {
                const credit = amt * USDT_TO_DMX_RATE;
                dmxBalance += credit;
                updateUI();
                addLog(`+${credit.toFixed(2)} DMX credited`, "text-green-400 font-bold");
            }, 1000);
        }

        function handleWithdraw() {
            const raw = prompt("DMX to withdraw:");
            const amt = parseFloat(raw);
            if(isNaN(amt) || amt <= 10 || amt > dmxBalance) return;
            setTimeout(() => {
                dmxBalance -= amt;
                updateUI();
                addLog(`${amt} DMX withdrawn`, "text-indigo-400");
            }, 1000);
        }

        function init3D() {
            const render3D = (id, mesh) => {
                const sc = new THREE.Scene();
                const re = new THREE.WebGLRenderer({alpha:true, antialias:true});
                re.setSize(200, 112); document.getElementById(id).appendChild(re.domElement);
                sc.add(mesh, new THREE.AmbientLight(0xffffff, 2)); 
                const ca = new THREE.PerspectiveCamera(75, 1, 0.1, 100); ca.position.z = 5;
                const anim = () => {
                    if (document.visibilityState === 'visible') {
                        if(!isPlaying) mesh.rotation.y += 0.01;
                        re.render(sc, ca);
                    }
                    requestAnimationFrame(anim);
                };
                anim();
            };
            coinMesh = new THREE.Mesh(new THREE.CylinderGeometry(2,2,0.4,32), new THREE.MeshStandardMaterial({color:0x6366f1, metalness:0.8}));
            coinMesh.rotation.x = Math.PI/2;
            diceMesh = new THREE.Mesh(new THREE.BoxGeometry(2.2,2.2,2.2), new THREE.MeshStandardMaterial({color:0x818cf8}));
            render3D('coinCanvas', coinMesh); render3D('diceCanvas', diceMesh);
        }

        function playGame(type) {
            const bet = parseInt(document.getElementById('betAmount').value);
            if(dmxBalance < bet || isPlaying) return;
            isPlaying = true; dmxBalance -= bet; updateUI();
            
            if(type === 'slot') startSlot(bet);
            else if(type === 'crash') startCrash(bet);
            else if(type === 'coin') {
                gsap.to(coinMesh.rotation, { y: coinMesh.rotation.y + 15, duration: 2 });
                setTimeout(() => finalize(Math.random() > 0.5, bet, 2), 2100);
            } else if(type === 'dice') {
                gsap.to(diceMesh.rotation, { x: "+=12", y: "+=12", duration: 1.5 });
                setTimeout(() => finalize(Math.floor(Math.random()*6)+1 === selectedSides.dice, bet, 6), 1600);
            } else if(type === 'battle') {
                gsap.to("#p1", { x: 40, repeat: 9, yoyo: true, duration: 0.1 });
                gsap.to("#p2", { x: -40, repeat: 9, yoyo: true, duration: 0.1 });
                setTimeout(() => finalize(Math.random() > 0.5, bet, 2), 1500);
            }
        }

        function finalize(won, bet, mult) {
            isPlaying = false;
            if(won) {
                dmxBalance += (bet * mult);
                sounds.win.play();
                triggerCelebration(mult);
                addLog(`WIN: +${(bet*mult).toFixed(2)} DMX`, "text-green-400 font-bold");
            } else {
                sounds.lose.play();
                addLog(`LOSE: -${bet} DMX`, "text-red-500");
            }
            updateUI();
        }

        function triggerCelebration(m) {
            const b = document.getElementById('mainBody');
            b.classList.add('shake-heavy');
            setTimeout(() => b.classList.remove('shake-heavy'), 500);
            if(m >= 2) {
                gsap.to("#winOverlay", { opacity: 1, duration: 0.1, yoyo: true, repeat: 5 });
                confetti({ particleCount: 100, spread: 50, origin: { y: 0.7 } });
            }
        }

        function startSlot(bet) {
            sounds.spin.play();
            const reels = document.querySelectorAll('.reel-hd');
            reels.forEach(r => r.classList.add('reel-blur'));
            const res = [Math.floor(Math.random()*6), Math.floor(Math.random()*6), Math.floor(Math.random()*6)];
            [1,2,3].forEach((id, i) => {
                gsap.to(`#reel${id}`, { y: -2000, duration: 2 + i, ease: "power2.inOut", onComplete: () => {
                    gsap.set(`#reel${id}`, { y: -(res[i]*80) });
                    document.getElementById(`reel${id}`).parentElement.classList.remove('reel-blur');
                    if(id === 3) { sounds.spin.stop(); finalize((res[0]===res[1] && res[1]===res[2]), bet, 10); }
                }});
            });
        }

        function startCrash(bet) {
            document.getElementById('crashBtn').classList.add('hidden');
            document.getElementById('cashoutBtn').classList.remove('hidden');
            document.getElementById('crashMult').classList.remove('glow-active');
            
            // Animation: Reset Rocket Position & Start Shake
            gsap.set("#rocket", { y: 0, x: 0 });
            gsap.to("#rocket", { x: 2, repeat: -1, yoyo: true, duration: 0.05 });
            
            let t = 0; const boom = 1.1 + Math.random() * 5;
            crashInt = setInterval(() => {
                t += 0.05; crashVal = Math.pow(Math.E, t/10);
                document.getElementById('crashMult').innerText = crashVal.toFixed(2) + "x";
                document.getElementById('crashBar').style.width = Math.min(100, (t*20)) + "%";
                
                // Animation: Fly Upwards
                gsap.set("#rocket", { y: -(t * 5) });

                if(crashVal > 2) document.getElementById('crashMult').classList.add('glow-active');
                if(crashVal >= boom) {
                    clearInterval(crashInt); 
                    sounds.boom.play();
                    gsap.killTweensOf("#rocket");
                    addLog("CRASH!", "text-red-500 font-black");
                    document.getElementById('cashoutBtn').classList.add('hidden');
                    document.getElementById('crashBtn').classList.remove('hidden');
                    finalize(false, bet, 0);
                }
            }, 100);
        }

        function cashoutCrash() {
            clearInterval(crashInt);
            gsap.killTweensOf("#rocket");
            document.getElementById('cashoutBtn').classList.add('hidden');
            document.getElementById('crashBtn').classList.remove('hidden');
            finalize(true, parseInt(document.getElementById('betAmount').value), crashVal);
        }

        function toggleAmbience() {
            ambienceOn = !ambienceOn;
            ambienceOn ? sounds.casino.play() : sounds.casino.stop();
            document.getElementById('muteBtn').innerText = ambienceOn ? "🔊 ON" : "🔈 OFF";
        }

        function updateUI() {
            document.getElementById('dmxGame').innerText = dmxBalance.toFixed(2) + " DMX";
            document.getElementById('betValue').innerText = document.getElementById('betAmount').value + " DMX";
        }

        function setSide(g, v) { 
            selectedSides[g] = v; 
            document.querySelectorAll(`[id^="${g}"]`).forEach(b => b.classList.remove('active-selection'));
            document.getElementById(g + v).classList.add('active-selection');
        }

        function addLog(m, c="text-slate-500") {
            const e = document.createElement('div'); e.className = `pb-1 border-b border-white/5 ${c}`;
            e.innerHTML = `<span class="opacity-30 mr-2">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span> ${m}`;
            document.getElementById('liveFeed').prepend(e);
        }

        function copyRef() {
            if(!userWallet) return alert("Connect Wallet First");
            navigator.clipboard.writeText(document.getElementById('refLinkDisplay').innerText);
            addLog("Success: Link Copied", "text-indigo-400");
        }

        window.onload = () => {
            init3D(); fetchOracle(); setInterval(fetchOracle, 30000);
            [1,2,3].forEach(id => {
                const r = document.getElementById(`reel${id}`);
                for(let i=0; i<45; i++) {
                    const d = document.createElement('div'); d.className='symbol-hd'; 
                    d.innerText = ['💎','💰','7️⃣','🔔','👑','⚡'][i%6]; r.appendChild(d);
                }
            });
        };
    </script>
</body>
</html>
