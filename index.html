<!DOCTYPE html>  <html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  
    <title>DMX ELITE - V19.5 LOBBY</title>  
    <script src="https://cdn.tailwindcss.com"></script>  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>  
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>  <script type="module">  
    import { createAppKit } from 'https://esm.sh/@reown/appkit?bundle'  
    import { Ethers5Adapter } from 'https://esm.sh/@reown/appkit-adapter-ethers5?bundle'  
    import { bsc } from 'https://esm.sh/@reown/appkit/networks?bundle'  

    <script type="module">    
        import { createAppKit } from 'https://esm.sh/@reown/appkit?bundle'    
        import { Ethers5Adapter } from 'https://esm.sh/@reown/appkit-adapter-ethers5?bundle'    
        import { bsc } from 'https://esm.sh/@reown/appkit/networks?bundle'    
            
        const projectId = '059cc242b0cc96ac9665c598b76ddc7b';    
            
        const modal = createAppKit({    
          adapters: [new Ethers5Adapter()],    
          networks: [bsc],    
          metadata: {     
            name: 'DimeX Pro',     
            url: window.location.origin,     
            icons: ['https://i.ibb.co/HpqwGFqt/logo.png']     
          },    
          projectId,    
          features: { analytics: true }    
        });    
            
        window.appKitModal = modal;    
            
        const syncWallet = async () => {  
            const provider = modal.getWalletProvider();  
            if (provider) {  
                const accounts = await provider.request({ method: 'eth_accounts' });  
                if (accounts.length > 0) {  
                    const addr = accounts[0];  
                    document.getElementById('connectBtn').innerText = addr.slice(0, 6) + "..." + addr.slice(-4);  
                    // Demo balance boost for connected users  
                    window.balance = 5000.00;  
                    window.updateUI();  
                }  
            }  
        };  
  
        window.syncWallet = syncWallet;  
  
        modal.subscribeState((state) => {    
          if(state?.isConnected) syncWallet();    
        });    
            
        window.addEventListener("load", () => {      
            let retry = 0;      
            const reconnect = setInterval(() => {      
                if(modal.getWalletProvider()){      
                    syncWallet();      
                    clearInterval(reconnect);      
                }      
                if(++retry >= 10) clearInterval(reconnect);      
            }, 1000);      
        });      
  
        window.connectWallet = () => modal.open();  

<style>  
    :root { --primary: #6366f1; --dark: #020617; }  
    body { background: var(--dark); color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }  
    .master-card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 1.2rem; }  
    .btn-master { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); font-weight: 800; transition: 0.3s; text-transform: uppercase; border-radius: 0.75rem; }  
    .active-selection { border: 2px solid #6366f1 !important; background: rgba(99, 102, 241, 0.2) !important; }  
    .reel-blur { filter: blur(6px); }  
    .glow-active { text-shadow: 0 0 20px var(--primary); animation: pulse-glow 0.8s infinite; }  
    @keyframes pulse-glow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }  
    .shake-heavy { animation: shake 0.5s both; }  
    @keyframes shake { 10%, 90% { transform: translate3d(-1px, 1px, 0); } 20%, 80% { transform: translate3d(2px, -2px, 0); } }  
    #winOverlay { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 50; background: radial-gradient(circle, rgba(245, 158, 11, 0.3) 0%, transparent 70%); }  
    .slot-window { display: flex; gap: 5px; justify-content: center; background: #000; padding: 10px; border-radius: 1rem; height: 100px; border: 1px solid #1e293b; overflow: hidden; }  
    .reel-hd { width: 60px; height: 80px; overflow: hidden; position: relative; background: #0a0a0a; border-radius: 8px; }  
    .symbol-hd { height: 80px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }  
    .game-screen { display: none; }  
    .lobby-card:hover { transform: translateY(-5px); border-color: #6366f1; }  
</style>

</head>  
<body id="mainBody" class="p-2 md:p-4">  
    <div id="winOverlay"></div>  <header class="max-w-7xl mx-auto mb-4 flex justify-between items-center">  
    <div>  
        <h1 class="text-xl font-black italic tracking-tighter text-white">DMX <span class="text-indigo-500">V19.5</span></h1>  
        <p class="text-[9px] text-slate-500 uppercase font-bold">Oracle: <span id="uiRate" class="text-indigo-400">---</span> DMX/USDT</p>  
    </div>  
    <div class="flex gap-2">  
        <button onclick="toggleAmbience()" id="muteBtn" class="master-card px-3 py-1 text-[10px] text-slate-400 border border-white/10">🔈 OFF</button>  
        <div class="master-card px-4 py-1 text-right">  
            <div id="refEarnings" class="text-[9px] text-green-500 font-bold">INVITER: NONE</div>  
            <div id="dmxGame" class="text-xs font-bold text-indigo-400">500.00 DMX</div>  
        </div>  
        <button onclick="window.appKitModal.open()" id="connectBtn" class="btn-master px-4 py-2 text-[10px]">CONNECT</button>  
    </div>  
</header>  

<main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-4 h-[78vh]">  
    <div class="lg:col-span-3 space-y-4 flex flex-col">  
        <section class="master-card p-4">  
            <div class="flex justify-between text-[10px] font-bold text-slate-500 uppercase mb-2">  
                <span>Bet</span>  
                <span id="betValue" class="text-indigo-400">10 DMX</span>  
            </div>  
            <input id="betAmount" type="range" min="1" max="1000" value="10" oninput="updateUI()" class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer mb-4">  
            <div class="grid grid-cols-2 gap-2">  
                <button onclick="handleDeposit()" class="bg-green-600/20 border border-green-500/50 p-2 rounded-lg text-[10px] font-bold">DEPOSIT</button>  
                <button onclick="handleWithdraw()" class="bg-indigo-600/20 border border-indigo-500/50 p-2 rounded-lg text-[10px] font-bold">WITHDRAW</button>  
            </div>  
        </section>  
          
        <section class="master-card p-4 flex-1 overflow-hidden flex flex-col">  
            <p class="text-[10px] font-bold text-indigo-500 uppercase mb-2">Live Protocol Logs</p>  
            <div id="liveFeed" class="flex-1 overflow-y-auto space-y-1 text-[9px] font-mono scroll-smooth"></div>  
        </section>  
    </div>  

    <div class="lg:col-span-9 overflow-y-auto pr-1">  
          
        <div id="lobbyScreen" class="grid grid-cols-2 md:grid-cols-3 gap-4">  
            <div onclick="openGame('battle')" class="master-card p-3 cursor-pointer lobby-card transition-all">  
                <div class="h-24 bg-indigo-500/10 rounded-lg mb-2 flex items-center justify-center text-4xl">⚔️</div>  
                <p class="text-center text-sm font-bold uppercase tracking-widest">Battle Arena</p>  
            </div>  
            <div onclick="openGame('coin')" class="master-card p-3 cursor-pointer lobby-card transition-all">  
                <div class="h-24 bg-yellow-500/10 rounded-lg mb-2 flex items-center justify-center text-4xl">🪙</div>  
                <p class="text-center text-sm font-bold uppercase tracking-widest">Coin Flip</p>  
            </div>  
            <div onclick="openGame('slot')" class="master-card p-3 cursor-pointer lobby-card transition-all">  
                <div class="h-24 bg-red-500/10 rounded-lg mb-2 flex items-center justify-center text-4xl">🎰</div>  
                <p class="text-center text-sm font-bold uppercase tracking-widest">DMX Slots</p>  
            </div>  
            <div onclick="openGame('crash')" class="master-card p-3 cursor-pointer lobby-card transition-all">  
                <div class="h-24 bg-green-500/10 rounded-lg mb-2 flex items-center justify-center text-4xl">🚀</div>  
                <p class="text-center text-sm font-bold uppercase tracking-widest">Hyper Crash</p>  
            </div>  
            <div onclick="openGame('dice')" class="master-card p-3 cursor-pointer lobby-card transition-all">  
                <div class="h-24 bg-blue-500/10 rounded-lg mb-2 flex items-center justify-center text-4xl">🎲</div>  
                <p class="text-center text-sm font-bold uppercase tracking-widest">3D Dice</p>  
            </div>  
        </div>  

        <div id="battleGame" class="game-screen master-card p-6 flex flex-col items-center">  
            <button onclick="backToLobby()" class="self-start text-[10px] text-indigo-400 mb-4 font-bold">← BACK TO LOBBY</button>  
            <div class="flex justify-around items-center w-full h-32 bg-black/40 rounded-xl mb-6">  
                <div id="p1" class="text-6xl">⚔️</div>  
                <div class="text-indigo-500 animate-pulse font-black">VS</div>  
                <div id="p2" class="text-6xl">🛡️</div>  
            </div>  
            <div class="flex gap-4 w-full max-w-md mb-4">  
                <button onclick="setSide('battle', 0)" id="battle0" class="flex-1 py-3 master-card active-selection text-xs">WARRIOR</button>  
                <button onclick="setSide('battle', 1)" id="battle1" class="flex-1 py-3 master-card text-xs">PALADIN</button>  
            </div>  
            <button onclick="playGame('battle')" class="btn-master w-full max-w-md py-4">Fight</button>  
        </div>  

        <div id="coinGame" class="game-screen master-card p-6 flex flex-col items-center">  
            <button onclick="backToLobby()" class="self-start text-[10px] text-indigo-400 mb-4 font-bold">← BACK TO LOBBY</button>  
            <div id="coinCanvas" class="w-full h-40 flex justify-center"></div>  
            <div class="flex gap-4 w-full max-w-md mb-4 mt-4">  
                <button onclick="setSide('coin', 0)" id="coin0" class="flex-1 py-3 master-card active-selection text-xs">HEADS</button>  
                <button onclick="setSide('coin', 1)" id="coin1" class="flex-1 py-3 master-card text-xs">TAILS</button>  
            </div>  
            <button onclick="playGame('coin')" class="btn-master w-full max-w-md py-4">Flip Coin</button>  
        </div>  

        <div id="slotGame" class="game-screen master-card p-6 flex flex-col items-center">  
            <button onclick="backToLobby()" class="self-start text-[10px] text-indigo-400 mb-4 font-bold">← BACK TO LOBBY</button>  
            <div class="slot-window mb-6 w-full max-w-sm">  
                <div class="reel-hd"><div id="reel1" class="absolute w-full"></div></div>  
                <div class="reel-hd"><div id="reel2" class="absolute w-full"></div></div>  
                <div class="reel-hd"><div id="reel3" class="absolute w-full"></div></div>  
            </div>  
            <button onclick="playGame('slot')" id="slotBtn" class="btn-master w-full max-w-sm py-5 text-lg">SPIN</button>  
        </div>  

        <div id="crashGame" class="game-screen master-card p-6 flex flex-col">  
            <button onclick="backToLobby()" class="self-start text-[10px] text-indigo-400 mb-4 font-bold">← BACK TO LOBBY</button>  
            <div class="flex justify-between items-center mb-8">  
                <h3 id="crashMult" class="text-6xl font-black text-indigo-400">1.00x</h3>  
                <div id="rocket" class="text-6xl">🚀</div>  
            </div>  
            <div class="h-2 bg-slate-800 w-full rounded-full mb-8"><div id="crashBar" class="h-full bg-indigo-500 w-0 transition-all"></div></div>  
            <div class="flex gap-4">  
                <button onclick="playGame('crash')" id="crashBtn" class="btn-master flex-1 py-5">TAKE OFF</button>  
                <button onclick="cashoutCrash()" id="cashoutBtn" class="hidden flex-1 py-5 bg-green-600 rounded-xl font-black text-white">CASHOUT</button>  
            </div>  
        </div>  

        <div id="diceGame" class="game-screen master-card p-6 flex flex-col items-center">  
            <button onclick="backToLobby()" class="self-start text-[10px] text-indigo-400 mb-4 font-bold">← BACK TO LOBBY</button>  
            <div id="diceCanvas" class="w-full h-40 flex justify-center"></div>  
            <div class="grid grid-cols-6 gap-2 w-full max-w-md mb-4 mt-4">  
                <button onclick="setSide('dice', 1)" id="dice1" class="py-3 master-card active-selection text-xs font-bold">1</button>  
                <button onclick="setSide('dice', 2)" id="dice2" class="py-3 master-card text-xs font-bold">2</button>  
                <button onclick="setSide('dice', 3)" id="dice3" class="py-3 master-card text-xs font-bold">3</button>  
                <button onclick="setSide('dice', 4)" id="dice4" class="py-3 master-card text-xs font-bold">4</button>  
                <button onclick="setSide('dice', 5)" id="dice5" class="py-3 master-card text-xs font-bold">5</button>  
                <button onclick="setSide('dice', 6)" id="dice6" class="py-3 master-card text-xs font-bold">6</button>  
            </div>  
            <button onclick="playGame('dice')" class="btn-master w-full max-w-md py-4">Roll Dice</button>  
        </div>  

    </div>  
</main>  

<script>  
    let dmxBalance = 500, USDT_TO_DMX_RATE = 100, isPlaying = false;  
    let selectedSides = {coin:0, dice:1, battle:0}, ambienceOn = false;  
    let coinMesh, diceMesh, crashVal, crashInt, userWallet = null;  

    const sounds = {  
        win: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-casino-bling-notification-229.mp3'] }),  
        lose: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3'], volume: 0.2 }),  
        spin: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-mechanical-spin-wheel-click-1139.mp3'], loop: true }),  
        boom: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-explosive-impact-boom-2580.mp3'] }),  
        casino: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-casino-slot-machine-room-ambience-1982.mp3'], loop: true, volume: 0.1 })  
    };  

    // --- NAVIGATION ---  
    function openGame(game) {  
        document.getElementById('lobbyScreen').style.display = 'none';  
        document.querySelectorAll('.game-screen').forEach(s => s.style.display = 'none');  
        document.getElementById(game + 'Game').style.display = 'flex';  
    }  

    function backToLobby() {  
        if(isPlaying) return alert("Finish your round first!");  
        document.querySelectorAll('.game-screen').forEach(s => s.style.display = 'none');  
        document.getElementById('lobbyScreen').style.display = 'grid';  
    }  

    // --- 3D ENGINE (TEXTURED) ---  
    function init3D() {  
        const loader = new THREE.TextureLoader();  
        const heads = loader.load("https://i.imgur.com/4Y9VZ9T.png");  
        const tails = loader.load("https://i.imgur.com/Y3X8FQK.png");  
          
        const diceTex = [  
            loader.load("https://i.imgur.com/Vg6K2YH.png"), loader.load("https://i.imgur.com/1Jc7WQm.png"),  
            loader.load("https://i.imgur.com/3RjvF5Q.png"), loader.load("https://i.imgur.com/6uB0bJX.png"),  
            loader.load("https://i.imgur.com/Y0jvA0k.png"), loader.load("https://i.imgur.com/1s9s0vP.png")  
        ];  

        const render3D = (id, mesh) => {  
            const sc = new THREE.Scene();  
            const re = new THREE.WebGLRenderer({alpha:true, antialias:true});  
            re.setSize(200, 160); document.getElementById(id).appendChild(re.domElement);  
            sc.add(mesh, new THREE.AmbientLight(0xffffff, 2));   
            const ca = new THREE.PerspectiveCamera(50, 200/160, 0.1, 100); ca.position.z = 6;  
            const anim = () => { requestAnimationFrame(anim); if(!isPlaying) mesh.rotation.y += 0.01; re.render(sc, ca); };  
            anim();  
        };  

        coinMesh = new THREE.Mesh(new THREE.CylinderGeometry(2,2,0.4,32), [  
            new THREE.MeshStandardMaterial({color:0xfbbf24}),  
            new THREE.MeshStandardMaterial({map:heads}),  
            new THREE.MeshStandardMaterial({map:tails})  
        ]);  
        coinMesh.rotation.x = Math.PI/2;  

        diceMesh = new THREE.Mesh(new THREE.BoxGeometry(2.2,2.2,2.2), diceTex.map(t => new THREE.MeshStandardMaterial({map:t})));  

        render3D('coinCanvas', coinMesh); render3D('diceCanvas', diceMesh);  
    }  

    // --- GAME LOGIC ---  
    function playGame(type) {  
        const bet = parseInt(document.getElementById('betAmount').value);  
        if(dmxBalance < bet || isPlaying) return;  
        isPlaying = true; dmxBalance -= bet; updateUI();  

        if(type === 'slot') startSlot(bet);  
        else if(type === 'crash') startCrash(bet);  
        else if(type === 'coin') {  
            gsap.to(coinMesh.rotation, { y: coinMesh.rotation.y + 20, duration: 2, onComplete: () => finalize(Math.random() > 0.5, bet, 2) });  
        } else if(type === 'dice') {  
            gsap.to(diceMesh.rotation, { x: "+=15", y: "+=15", duration: 1.5, onComplete: () => finalize(Math.floor(Math.random()*6)+1 === selectedSides.dice, bet, 6) });  
        } else if(type === 'battle') {  
            gsap.to("#p1", { x: 40, repeat: 9, yoyo: true, duration: 0.1 });  
            gsap.to("#p2", { x: -40, repeat: 9, yoyo: true, duration: 0.1, onComplete: () => finalize(Math.random() > 0.5, bet, 2) });  
        }  
    }  

    function startCrash(bet) {  
        document.getElementById('crashBtn').classList.add('hidden');  
        document.getElementById('cashoutBtn').classList.remove('hidden');  
        gsap.set("#rocket", { y: 0, x: 0 });  
        gsap.to("#rocket", { x: 2, repeat: -1, yoyo: true, duration: 0.05 });  
        let t = 0; const boom = 1.1 + Math.random() * 4;  
        crashInt = setInterval(() => {  
            t += 0.05; crashVal = Math.pow(Math.E, t/10);  
            document.getElementById('crashMult').innerText = crashVal.toFixed(2) + "x";  
            document.getElementById('crashBar').style.width = Math.min(100, (t*25)) + "%";  
            gsap.set("#rocket", { y: -(t * 8) });  
            if(crashVal >= boom) {  
                clearInterval(crashInt); sounds.boom.play(); gsap.killTweensOf("#rocket");  
                document.getElementById('cashoutBtn').classList.add('hidden');  
                document.getElementById('crashBtn').classList.remove('hidden');  
                finalize(false, bet, 0);  
            }  
        }, 100);  
    }  

    function cashoutCrash() {  
        clearInterval(crashInt); gsap.killTweensOf("#rocket");  
        document.getElementById('cashoutBtn').classList.add('hidden');  
        document.getElementById('crashBtn').classList.remove('hidden');  
        finalize(true, parseInt(document.getElementById('betAmount').value), crashVal);  
    }  

    function finalize(won, bet, mult) {  
        isPlaying = false;  
        if(won) {  
            const winAmt = bet * mult;  
            dmxBalance += winAmt; sounds.win.play(); triggerCelebration();  
            addLog(`PROFIT: +${winAmt.toFixed(2)} DMX`, "text-green-400 font-bold");  
        } else {  
            sounds.lose.play();  
            addLog(`LOSS: -${bet} DMX`, "text-red-500");  
        }  
        updateUI();  
    }  

    function startSlot(bet) {  
        sounds.spin.play();  
        const reels = document.querySelectorAll('.reel-hd');  
        reels.forEach(r => r.classList.add('reel-blur'));  
        const res = [Math.floor(Math.random()*6), Math.floor(Math.random()*6), Math.floor(Math.random()*6)];  
        [1,2,3].forEach((id, i) => {  
            gsap.to(`#reel${id}`, { y: -2000, duration: 2 + i, ease: "power2.inOut", onComplete: () => {  
                gsap.set(`#reel${id}`, { y: -(res[i]*80) });  
                document.getElementById(`reel${id}`).parentElement.classList.remove('reel-blur');  
                if(id === 3) { sounds.spin.stop(); finalize((res[0]===res[1] && res[1]===res[2]), bet, 10); }  
            }});  
        });  
    }  

    // --- UTILS ---  
    function triggerCelebration() {  
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });  
        gsap.to("#winOverlay", { opacity: 1, duration: 0.1, yoyo: true, repeat: 3 });  
    }  

    function addLog(m, c="text-slate-500") {  
        const feed = document.getElementById('liveFeed');  
        const e = document.createElement('div');  
        e.className = `pb-1 border-b border-white/5 ${c}`;  
        e.innerHTML = `<span class="opacity-30 mr-2">[${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'})}]</span> ${m}`;  
        feed.appendChild(e);  
        feed.scrollTop = feed.scrollHeight;  
    }  

    function updateUI() {  
        document.getElementById('dmxGame').innerText = dmxBalance.toFixed(2) + " DMX";  
        document.getElementById('betValue').innerText = document.getElementById('betAmount').value + " DMX";  
    }  

    function setSide(g, v) {   
        selectedSides[g] = v;   
        document.querySelectorAll(`[id^="${g}"]`).forEach(b => b.classList.remove('active-selection'));  
        document.getElementById(g + v).classList.add('active-selection');  
    }  

    function toggleAmbience() {  
        ambienceOn = !ambienceOn;  
        ambienceOn ? sounds.casino.play() : sounds.casino.stop();  
        document.getElementById('muteBtn').innerText = ambienceOn ? "🔊 ON" : "🔈 OFF";  
    }  

    window.onload = () => {  
        init3D();  
        updateUI();  
        addLog("System initialized. Welcome to DimeX Elite.", "text-indigo-400");  
        [1,2,3].forEach(id => {  
            const r = document.getElementById(`reel${id}`);  
            for(let i=0; i<45; i++) {  
                const d = document.createElement('div'); d.className='symbol-hd';   
                d.innerText = ['💎','💰','7️⃣','🔔','👑','⚡'][i%6]; r.appendChild(d);  
            }  
        });  
    };  
</script>

</body>  
</html>
