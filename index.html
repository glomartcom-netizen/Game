<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DMX ELITE - V22.0 PRO OFFICIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { --primary: #6366f1; --dark: #020617; }
        body { background: var(--dark); color: white; font-family: 'Inter', sans-serif; min-height: 100vh; margin:0; overflow-x:hidden; }
        .master-card { background: linear-gradient(145deg,#0f172a,#020617); backdrop-filter: blur(25px); border:1px solid rgba(255,255,255,0.06); border-radius:16px; }
        .btn-master { background: linear-gradient(135deg,#6366f1,#a855f7); font-weight:800; border-radius:12px; transition: all 0.25s; text-transform: uppercase; cursor:pointer; color:white; border:none; }
        .lobby-card { background: linear-gradient(145deg,#0f172a,#020617); border:1px solid rgba(255,255,255,0.08); border-radius:16px; transition: all 0.25s ease; cursor:pointer; text-align:center; padding:20px; }
        .lobby-card:hover { border-color:#6366f1; transform:translateY(-5px); box-shadow:0 5px 20px rgba(99,102,241,0.3); }
        .game-screen { display:none; width:100%; min-height:500px; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(circle,#1e293b 0%,#020617 100%); border-radius:20px; position:relative; }
        .active-selection { border:2px solid #6366f1!important; background: rgba(99,102,241,0.3)!important; }
        #winPopup { position: fixed; top:50%; left:50%; transform: translate(-50%, -50%) scale(0); background: rgba(0,0,0,0.95); border:2px solid gold; padding:40px; border-radius:20px; z-index:1000; text-align:center; transition:0.3s cubic-bezier(0.175,0.885,0.32,1.275); }
        #crashArea { width:100%; height:300px; position:relative; overflow:hidden; border-bottom:2px solid #334155; }
        #rocket { position:absolute; bottom:20px; left:20px; font-size:3rem; transform:rotate(45deg); z-index:10; transition: transform 0.1s linear; }
        .reel-hd { width:80px; height:100px; overflow:hidden; position:relative; background:#111; border-radius:10px; border:2px solid #334155; }
    </style>
</head>
<body class="p-2 md:p-4">

    <div id="winPopup">
        <h2 class="text-yellow-500 font-black text-4xl mb-2">WINNER! 🎉</h2>
        <p id="winAmountMsg" class="text-white text-2xl font-bold">0.00 DMX</p>
    </div>

    <header class="max-w-7xl mx-auto mb-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black italic tracking-tighter">DMX <span class="text-indigo-500">V22.0 PRO</span></h1>
            <p class="text-[9px] text-slate-500 font-bold uppercase">Status: <span class="text-green-400">Online</span></p>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleAmbience()" id="muteBtn" class="master-card px-3 py-1 text-[10px]">🔈 SOUND: OFF</button>
            <div class="master-card px-4 py-1 text-right">
                <div id="dmxGame" class="text-xs font-bold text-indigo-400">500.00 DMX</div>
            </div>
            <button onclick="connectWallet()" id="connectBtn" class="btn-master px-4 py-2 text-[10px]">CONNECT WALLET</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-4">
        <div class="lg:col-span-3 space-y-4">
            <section class="master-card p-4">
                <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-2"><span>BET AMOUNT</span><span id="betValue" class="text-indigo-400">10 DMX</span></div>
                <input id="betAmount" type="range" min="10" max="1000" step="10" value="10" oninput="updateUI()" class="w-full h-1 bg-slate-800 rounded-lg appearance-none mb-4">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="walletAction('Deposit')" class="bg-green-600/20 border border-green-500/50 p-2 rounded-lg text-[10px] font-bold">DEPOSIT</button>
                    <button onclick="walletAction('Withdraw')" class="bg-indigo-600/20 border border-indigo-500/50 p-2 rounded-lg text-[10px] font-bold">WITHDRAW</button>
                </div>
            </section>
            <section class="master-card p-4">
                <p class="text-[10px] text-slate-500 font-bold mb-2">REFERRAL (5%)</p>
                <div class="bg-black/40 p-2 rounded text-[10px] text-indigo-300 break-all mb-3 text-center border border-white/5" id="refLink">Connect wallet</div>
                <button onclick="walletAction('Claim')" class="btn-master w-full py-2 text-[10px]">CLAIM REWARDS</button>
            </section>
            <section class="master-card p-4 h-[200px] flex flex-col">
                <p class="text-[10px] font-bold text-indigo-500 mb-2 uppercase">Live Activity</p>
                <div id="liveFeed" class="flex-1 overflow-y-auto space-y-1 text-[9px] font-mono"></div>
            </section>
        </div>

        <div class="lg:col-span-9">
            <div id="lobbyScreen" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div onclick="openGame('coin')" class="lobby-card">🪙<p class="text-[10px] font-bold mt-2">COIN FLIP</p></div>
                <div onclick="openGame('slot')" class="lobby-card">🎰<p class="text-[10px] font-bold mt-2">SLOTS</p></div>
                <div onclick="openGame('crash')" class="lobby-card">🚀<p class="text-[10px] font-bold mt-2">CRASH</p></div>
                <div onclick="openGame('dice')" class="lobby-card">🎲<p class="text-[10px] font-bold mt-2">DICE</p></div>
                <div onclick="openGame('battle')" class="lobby-card">⚔️<p class="text-[10px] font-bold mt-2">BATTLE</p></div>
            </div>

            <div id="coinGame" class="game-screen">
                <button onclick="backToLobby()" class="absolute top-4 left-4 text-xs font-bold text-indigo-400">← EXIT</button>
                <div id="coinCanvas" class="h-48 w-full"></div>
                <div class="flex gap-4 my-6">
                    <button onclick="setSide('coin', 'Heads')" id="coinHeads" class="px-8 py-3 master-card active-selection font-bold">HEADS</button>
                    <button onclick="setSide('coin', 'Tails')" id="coinTails" class="px-8 py-3 master-card font-bold">TAILS</button>
                </div>
                <button onclick="playGame('coin')" class="btn-master w-64 py-4">FLIP COIN</button>
            </div>

            <div id="diceGame" class="game-screen">
                <button onclick="backToLobby()" class="absolute top-4 left-4 text-xs font-bold text-indigo-400">← EXIT</button>
                <div id="diceCanvas" class="h-48 w-full"></div>
                <div class="grid grid-cols-6 gap-2 my-6">
                    <button onclick="setSide('dice', 1)" id="dice1" class="p-4 master-card active-selection">1</button>
                    <button onclick="setSide('dice', 2)" id="dice2" class="p-4 master-card">2</button>
                    <button onclick="setSide('dice', 3)" id="dice3" class="p-4 master-card">3</button>
                    <button onclick="setSide('dice', 4)" id="dice4" class="p-4 master-card">4</button>
                    <button onclick="setSide('dice', 5)" id="dice5" class="p-4 master-card">5</button>
                    <button onclick="setSide('dice', 6)" id="dice6" class="p-4 master-card">6</button>
                </div>
                <button onclick="playGame('dice')" class="btn-master w-64 py-4">ROLL DICE</button>
            </div>

            <div id="crashGame" class="game-screen">
                <button onclick="backToLobby()" class="absolute top-4 left-4 text-xs font-bold text-indigo-400">← EXIT</button>
                <div id="crashMult" class="text-7xl font-black text-indigo-500 mb-2">1.00x</div>
                <div id="crashArea"><div id="rocket">🚀</div></div>
                <div class="mt-6 flex flex-col items-center">
                    <button id="crashBtn" onclick="playGame('crash')" class="btn-master w-64 py-4">START ENGINE</button>
                    <button id="cashoutBtn" onclick="cashoutCrash()" class="hidden bg-green-500 w-64 py-4 rounded-xl font-black text-white">CASHOUT NOW</button>
                </div>
            </div>

            <div id="slotGame" class="game-screen">
                <button onclick="backToLobby()" class="absolute top-4 left-4 text-xs font-bold text-indigo-400">← EXIT</button>
                <div class="flex gap-4 mb-8 bg-black/50 p-6 rounded-3xl border-4 border-slate-700">
                    <div class="reel-hd"><div id="reel1" class="absolute w-full"></div></div>
                    <div class="reel-hd"><div id="reel2" class="absolute w-full"></div></div>
                    <div class="reel-hd"><div id="reel3" class="absolute w-full"></div></div>
                </div>
                <button onclick="playGame('slot')" class="btn-master w-64 py-4">SPIN</button>
            </div>

            <div id="battleGame" class="game-screen">
                <button onclick="backToLobby()" class="absolute top-4 left-4 text-xs font-bold text-indigo-400">← EXIT</button>
                <div class="flex gap-4 mb-6">
                    <button onclick="setSide('battle', 'P1')" id="battleP1" class="p-8 master-card active-selection text-5xl">⚔️</button>
                    <div class="flex items-center text-2xl font-black">VS</div>
                    <button onclick="setSide('battle', 'P2')" id="battleP2" class="p-8 master-card text-5xl">🛡️</button>
                </div>
                <button onclick="playGame('battle')" class="btn-master w-64 py-4">START BATTLE</button>
                <p id="battleStatus" class="mt-4 font-bold text-xl text-indigo-400"></p>
            </div>
        </div>
    </main>

    <script>
        let dmxBalance = 500, isPlaying = false, currentCrash = 1, currentBet = 0, crashInterval;
        let selectedSides = { coin:'Heads', dice:1, battle:'P1' };
        let coinMesh, diceMesh, coinScene, diceScene;

        const sounds = {
            win: new Howl({src:['https://assets.mixkit.co/sfx/preview/mixkit-casino-bling-notification-229.mp3']}),
            lose: new Howl({src:['https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3']}),
            explosion: new Howl({src:['https://assets.mixkit.co/sfx/preview/mixkit-explosive-impact-boom-2580.mp3']}),
            ambience: new Howl({src:['https://assets.mixkit.co/sfx/preview/mixkit-casino-slot-machine-room-ambience-1982.mp3'], loop:true, volume:0.1})
        };

        const unlockAudio = () => {
            if(!sounds.ambience.playing()) sounds.ambience.play();
            document.removeEventListener('click', unlockAudio);
            document.removeEventListener('touchstart', unlockAudio);
        };
        document.addEventListener('click', unlockAudio);
        document.addEventListener('touchstart', unlockAudio);

        function updateUI() {
            document.getElementById('dmxGame').innerText = dmxBalance.toFixed(2) + " DMX";
            document.getElementById('betValue').innerText = document.getElementById('betAmount').value + " DMX";
        }

        function init3D(){
            const loader = new THREE.TextureLoader();
            const createBaseScene = (id) => {
                const sc = new THREE.Scene();
                const re = new THREE.WebGLRenderer({alpha:true, antialias:true});
                re.setSize(300, 150);
                document.getElementById(id).appendChild(re.domElement);
                const ca = new THREE.PerspectiveCamera(45, 2/1, 0.1, 100);
                ca.position.z = 5;
                const al = new THREE.AmbientLight(0xffffff, 2);
                sc.add(al);
                return {sc, re, ca};
            };

            // COIN
            coinScene = createBaseScene('coinCanvas');
            const coinGeom = new THREE.CylinderGeometry(2, 2, 0.3, 64);
            const goldMat = new THREE.MeshStandardMaterial({color: 0xd4af37, metalness:0.8, roughness:0.2});
            const headMat = new THREE.MeshStandardMaterial({map: loader.load('assets/heads.png', undefined, undefined, () => headMat.color.set(0xd4af37))});
            const tailMat = new THREE.MeshStandardMaterial({map: loader.load('assets/tails.png', undefined, undefined, () => tailMat.color.set(0xd4af37))});
            coinMesh = new THREE.Mesh(coinGeom, [goldMat, headMat, tailMat]);
            coinMesh.rotation.x = Math.PI/2;
            coinScene.sc.add(coinMesh);

            // DICE
            diceScene = createBaseScene('diceCanvas');
            const diceGeom = new THREE.BoxGeometry(2.2, 2.2, 2.2);
            const diceMats = [1,2,3,4,5,6].map(n => new THREE.MeshStandardMaterial({
                map: loader.load(`assets/dice${n}.png`, undefined, undefined, () => diceMats[n-1].color.set(0xffffff))
            }));
            diceMesh = new THREE.Mesh(diceGeom, diceMats);
            diceScene.sc.add(diceMesh);

            const animate = () => {
                requestAnimationFrame(animate);
                if(!isPlaying){
                    coinMesh.rotation.y += 0.01;
                    diceMesh.rotation.x += 0.01;
                    diceMesh.rotation.y += 0.01;
                }
                coinScene.re.render(coinScene.sc, coinScene.ca);
                diceScene.re.render(diceScene.sc, diceScene.ca);
            };
            animate();
        }

        function playGame(type){
            const bet = parseInt(document.getElementById('betAmount').value);
            if(dmxBalance < bet || isPlaying) return;

            isPlaying = true;
            dmxBalance -= bet;
            currentBet = bet;
            updateUI();

            if(type === 'coin'){
                const side = Math.random() < 0.5 ? "Heads" : "Tails";
                gsap.to(coinMesh.rotation, {
                    y: coinMesh.rotation.y + Math.PI * 10,
                    x: side === "Heads" ? Math.PI/2 : -Math.PI/2,
                    duration: 2,
                    onComplete: () => finalize(side === selectedSides.coin, bet, 1.9)
                });
            } else if(type === 'dice'){
                const res = Math.floor(Math.random()*6)+1;
                const rots = { 1:[0,0], 2:[0,Math.PI/2], 3:[0,-Math.PI/2], 4:[Math.PI/2,0], 5:[-Math.PI/2,0], 6:[Math.PI,0] };
                gsap.to(diceMesh.rotation, {
                    x: rots[res][0] + (Math.PI*8),
                    y: rots[res][1] + (Math.PI*8),
                    duration: 2,
                    onComplete: () => finalize(res === selectedSides.dice, bet, 5)
                });
            } else if(type === 'crash'){
                startCrash(bet);
            } else if(type === 'slot'){
                startSlots(bet);
            } else if(type === 'battle'){
                startBattle(bet);
            }
        }

        function startCrash(bet){
            document.getElementById('crashBtn').classList.add('hidden');
            document.getElementById('cashoutBtn').classList.remove('hidden');
            currentCrash = 1.0;
            const limit = Math.random() * 4 + 1.1;
            
            crashInterval = setInterval(() => {
                currentCrash += 0.03;
                document.getElementById('crashMult').innerText = currentCrash.toFixed(2) + "x";
                gsap.to("#rocket", { x: (currentCrash-1)*100, y: -(currentCrash-1)*40, duration: 0.1 });

                if(currentCrash >= limit){
                    clearInterval(crashInterval);
                    sounds.explosion.play();
                    document.getElementById('rocket').innerText = "💥🔥";
                    setTimeout(() => {
                        document.getElementById('crashBtn').classList.remove('hidden');
                        document.getElementById('cashoutBtn').classList.add('hidden');
                        document.getElementById('rocket').innerText = "🚀";
                        gsap.set("#rocket", {x:0, y:0});
                        finalize(false, bet, 0);
                    }, 1500);
                }
            }, 100);
        }

        function cashoutCrash(){
            if(!isPlaying) return;
            clearInterval(crashInterval);
            finalize(true, currentBet, currentCrash);
            document.getElementById('crashBtn').classList.remove('hidden');
            document.getElementById('cashoutBtn').classList.add('hidden');
            gsap.set("#rocket", {x:0, y:0});
        }

        function startSlots(bet){
            const res = [Math.floor(Math.random()*6), Math.floor(Math.random()*6), Math.floor(Math.random()*6)];
            [1,2,3].forEach((id, i) => {
                gsap.to(`#reel${id}`, {
                    y: -2400 - (res[i]*80),
                    duration: 2+i,
                    onComplete: () => { if(id===3) finalize(res[0]===res[1] && res[1]===res[2], bet, 10); }
                });
            });
        }

        function startBattle(bet){
            document.getElementById('battleStatus').innerText = "⚔️ Fighting...";
            setTimeout(() => {
                const won = Math.random() > 0.5;
                document.getElementById('battleStatus').innerText = won ? "🏆 Victory!" : "💀 Defeat!";
                finalize(won, bet, 1.8);
            }, 2000);
        }

        function finalize(won, bet, mult){
            isPlaying = false;
            if(won){
                const winAmt = bet * mult;
                dmxBalance += winAmt;
                sounds.win.play();
                showWinPopup(winAmt);
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                addLog(`Won: +${winAmt.toFixed(2)} DMX`, "text-green-400");
            } else {
                sounds.lose.play();
                addLog(`Lost: -${bet} DMX`, "text-red-500");
            }
            updateUI();
        }

        function showWinPopup(amt){
            const p = document.getElementById('winPopup');
            document.getElementById('winAmountMsg').innerText = `You Won ${amt.toFixed(2)} DMX`;
            p.style.transform = "translate(-50%, -50%) scale(1)";
            setTimeout(() => p.style.transform = "translate(-50%, -50%) scale(0)", 2500);
        }

        function addLog(m, c) {
            const f = document.getElementById('liveFeed');
            const d = document.createElement('div');
            d.className = c; d.innerText = `[${new Date().toLocaleTimeString()}] ${m}`;
            f.prepend(d);
        }

        function connectWallet() {
            isWalletConnected = true;
            document.getElementById('connectBtn').innerText = "0x7a2...f4d1";
            document.getElementById('refLink').innerText = "https://dmxelite.pro/ref?id=7a2f4d1";
            addLog("Wallet Linked", "text-indigo-400");
        }

        function walletAction(t) { if(!isWalletConnected) return alert("Connect Wallet First"); alert(t + " Pending..."); }
        function openGame(g) { document.getElementById('lobbyScreen').style.display='none'; document.getElementById(g+'Game').style.display='flex'; }
        function backToLobby() { document.getElementById('lobbyScreen').style.display='grid'; document.querySelectorAll('.game-screen').forEach(s=>s.style.display='none'); }
        function setSide(g, v) { selectedSides[g]=v; document.querySelectorAll(`[id^="${g}"]`).forEach(b=>b.classList.remove('active-selection')); document.getElementById(g+v).classList.add('active-selection'); }
        function toggleAmbience() { if(sounds.ambience.playing()){ sounds.ambience.stop(); document.getElementById('muteBtn').innerText="🔈 SOUND: OFF"; } else { sounds.ambience.play(); document.getElementById('muteBtn').innerText="🔊 SOUND: ON"; } }

        window.onload = () => {
            init3D();
            updateUI();
            [1,2,3].forEach(id => {
                const r = document.getElementById(`reel${id}`);
                for(let i=0; i<60; i++) {
                    const d = document.createElement('div');
                    d.className = 'h-[80px] flex items-center justify-center text-3xl';
                    d.innerText = ['💎','💰','7️⃣','🔔','👑','⚡'][i%6];
                    r.appendChild(d);
                }
            });
        };
    </script>
</body>
</html>
