<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DMX ELITE - V21.0 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { --primary: #6366f1; --dark: #020617; }
        /* 7️⃣ Mobile Screen Fix - Vertical Scroll Allowed */
        body { background: var(--dark); color: white; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; overflow-y: auto; margin: 0; }
        .master-card { background: linear-gradient(145deg,#0f172a,#020617); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; }
        .lobby-card { background: linear-gradient(145deg,#0f172a,#020617); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; transition: all 0.25s ease; cursor: pointer; position: relative; overflow: hidden; }
        .lobby-card:hover { transform: translateY(-6px); border-color: #6366f1; box-shadow: 0 10px 30px rgba(99,102,241,0.4); }
        .btn-master { background: linear-gradient(135deg,#6366f1,#a855f7); font-weight: 800; border-radius: 12px; transition: all 0.25s; text-transform: uppercase; cursor: pointer; color: white; border: none; }
        .game-screen { display: none; width: 100%; min-height: 450px; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #1e293b 0%, #020617 100%); border-radius: 20px; padding: 30px; position: relative; }
        .active-selection { border: 2px solid #6366f1!important; background: rgba(99,102,241,0.3)!important; box-shadow: 0 0 15px #6366f1; }
        #crashArea { width: 100%; height: 250px; position: relative; overflow: hidden; border-bottom: 2px solid #334155; }
        /* 5️⃣ Crash Fire Trail Style */
        #rocket { position: absolute; bottom: 10px; left: 10px; font-size: 3.5rem; transform: rotate(45deg); transition: text-shadow 0.2s; }
        .slot-window { display: flex; gap: 8px; justify-content: center; background: #000; padding: 15px; border-radius: 1.5rem; border: 3px solid #334155; }
        .reel-hd { width: 80px; height: 100px; overflow: hidden; position: relative; background: #111; border-radius: 10px; }
    </style>
</head>
<body class="p-2 md:p-4">
    <header class="max-w-7xl mx-auto mb-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black italic tracking-tighter">DMX <span class="text-indigo-500">V21.0</span></h1>
            <p class="text-[9px] text-slate-500 font-bold uppercase">DMX/USDT: <span class="text-green-400">0.0482</span></p>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleAmbience()" id="muteBtn" class="master-card px-3 py-1 text-[10px]">🔈 OFF</button>
            <div class="master-card px-4 py-1 text-right">
                <div id="modeLabel" class="text-[7px] text-yellow-500 font-bold uppercase">Demo Mode</div>
                <div id="dmxGame" class="text-xs font-bold text-indigo-400">0.00 DMX</div>
            </div>
            <button onclick="connectWallet()" id="connectBtn" class="btn-master px-4 py-2 text-[10px]">CONNECT</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-4">
        <div class="lg:col-span-3 space-y-4 flex flex-col">
            <section class="master-card p-4">
                <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-2"><span>BET AMOUNT</span><span id="betValue" class="text-indigo-400">10 DMX</span></div>
                <input id="betAmount" type="range" min="10" max="1000" value="10" oninput="updateUI()" class="w-full h-1 bg-slate-800 rounded-lg appearance-none mb-4">
                <div class="grid grid-cols-2 gap-2">
                    <button class="bg-green-600/20 border border-green-500/50 p-2 rounded-lg text-[10px] font-bold">DEPOSIT</button>
                    <button class="bg-indigo-600/20 border border-indigo-500/50 p-2 rounded-lg text-[10px] font-bold">WITHDRAW</button>
                </div>
            </section>
            <section class="master-card p-4 flex-1 overflow-hidden h-[300px] flex flex-col">
                <p class="text-[10px] font-bold text-indigo-500 uppercase mb-2">Live Activity</p>
                <div id="liveFeed" class="flex-1 overflow-y-auto space-y-1 text-[9px] font-mono"></div>
            </section>
        </div>

        <div class="lg:col-span-9">
            <div id="lobbyScreen" class="grid grid-cols-2 md:grid-cols-4 gap-4 pb-10">
                <div onclick="openGame('coin')" class="lobby-card p-6 text-center">🪙<p class="text-[10px] font-bold">COIN FLIP</p></div>
                <div onclick="openGame('slot')" class="lobby-card p-6 text-center">🎰<p class="text-[10px] font-bold">SLOTS</p></div>
                <div onclick="openGame('crash')" class="lobby-card p-6 text-center">🚀<p class="text-[10px] font-bold">CRASH</p></div>
                <div onclick="openGame('dice')" class="lobby-card p-6 text-center">🎲<p class="text-[10px] font-bold">DICE</p></div>
                <div onclick="openGame('battle')" class="lobby-card p-6 text-center">⚔️<p class="text-[10px] font-bold">BATTLE</p></div>
                <div class="lobby-card p-6 text-center opacity-40">📉<p class="text-[8px]">HI-LO</p></div>
                <div class="lobby-card p-6 text-center opacity-40">⚪<p class="text-[8px]">PLINKO</p></div>
                <div class="lobby-card p-6 text-center opacity-40">🎡<p class="text-[8px]">WHEEL</p></div>
                <div class="lobby-card p-6 text-center opacity-40">🔴<p class="text-[8px]">ROULETTE</p></div>
                <div class="lobby-card p-6 text-center opacity-40">♠️<p class="text-[8px]">BLACKJACK</p></div>
                <div class="lobby-card p-6 text-center opacity-40">🎴<p class="text-[8px]">TEEN PATTI</p></div>
                <div class="lobby-card p-6 text-center opacity-40">🔄<p class="text-[8px]">ANDAR BAHAR</p></div>
                <div class="lobby-card p-6 text-center opacity-40">🔢<p class="text-[8px]">KENO</p></div>
                <div class="lobby-card p-6 text-center opacity-40">🍀<p class="text-[8px]">LUCKY 7</p></div>
                <div class="lobby-card p-6 text-center opacity-40">🎨<p class="text-[8px]">COLOR BET</p></div>
            </div>

            <div id="coinGame" class="game-screen">
                <button onclick="backToLobby()" class="absolute top-4 left-4 text-xs font-bold text-indigo-400">← BACK</button>
                <div id="coinCanvas" class="h-48 w-full mb-4"></div>
                <div class="flex gap-4 mb-4">
                    <button onclick="setSide('coin', 'Heads')" id="coinHeads" class="px-6 py-2 master-card active-selection font-bold">HEADS</button>
                    <button onclick="setSide('coin', 'Tails')" id="coinTails" class="px-6 py-2 master-card font-bold">TAILS</button>
                </div>
                <button onclick="playGame('coin')" class="btn-master w-64 py-4">FLIP COIN</button>
            </div>

            <div id="diceGame" class="game-screen">
                <button onclick="backToLobby()" class="absolute top-4 left-4 text-xs font-bold text-indigo-400">← BACK</button>
                <div id="diceCanvas" class="h-48 w-full mb-4"></div>
                <div class="grid grid-cols-6 gap-2 mb-4">
                    <button onclick="setSide('dice', 1)" id="dice1" class="p-3 master-card active-selection text-2xl">⚀</button>
                    <button onclick="setSide('dice', 2)" id="dice2" class="p-3 master-card text-2xl">⚁</button>
                    <button onclick="setSide('dice', 3)" id="dice3" class="p-3 master-card text-2xl">⚂</button>
                    <button onclick="setSide('dice', 4)" id="dice4" class="p-3 master-card text-2xl">⚃</button>
                    <button onclick="setSide('dice', 5)" id="dice5" class="p-3 master-card text-2xl">⚄</button>
                    <button onclick="setSide('dice', 6)" id="dice6" class="p-3 master-card text-2xl">⚅</button>
                </div>
                <button onclick="playGame('dice')" class="btn-master w-64 py-4">ROLL DICE</button>
            </div>

            <div id="slotGame" class="game-screen">
                <button onclick="backToLobby()" class="absolute top-4 left-4 text-xs font-bold text-indigo-400">← BACK</button>
                <div class="slot-window mb-8">
                    <div class="reel-hd"><div id="reel1" class="absolute w-full"></div></div>
                    <div class="reel-hd"><div id="reel2" class="absolute w-full"></div></div>
                    <div class="reel-hd"><div id="reel3" class="absolute w-full"></div></div>
                </div>
                <button onclick="playGame('slot')" class="btn-master w-64 py-4">SPIN</button>
            </div>

            <div id="crashGame" class="game-screen">
                <button onclick="backToLobby()" class="absolute top-4 left-4 text-xs font-bold text-indigo-400">← BACK</button>
                <div id="crashMult" class="text-7xl font-black text-indigo-500 mb-2">1.00x</div>
                <div id="crashArea"><div id="rocket">🚀🔥</div></div>
                <div class="mt-6">
                    <button id="crashBtn" onclick="playGame('crash')" class="btn-master w-64 py-4">TAKE OFF</button>
                    <button id="cashoutBtn" onclick="cashoutCrash()" class="hidden bg-green-500 w-64 py-4 rounded-xl font-black text-white">CASHOUT</button>
                </div>
            </div>

            <div id="battleGame" class="game-screen">
                <button onclick="backToLobby()" class="absolute top-4 left-4 text-xs font-bold text-indigo-400">← BACK</button>
                <div class="flex gap-4 mb-6">
                    <button onclick="setSide('battle', 'P1')" id="battleP1" class="p-6 master-card active-selection text-5xl">⚔️</button>
                    <div class="flex items-center text-2xl font-black">VS</div>
                    <button onclick="setSide('battle', 'P2')" id="battleP2" class="p-6 master-card text-5xl">🛡️</button>
                </div>
                <button onclick="playGame('battle')" class="btn-master w-64 py-4">FIGHT!</button>
            </div>
        </div>
    </main>

    <script>
        let dmxBalance = 500, isPlaying = false, currentCrash = 1.0;
        let selectedSides = { coin: 'Heads', dice: 1, battle: 'P1' };
        let coinMesh, diceMesh, crashInterval, currentBet = 0;

        const sounds = {
            win: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-casino-bling-notification-229.mp3'] }),
            lose: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3'] }),
            ambience: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-casino-slot-machine-room-ambience-1982.mp3'], loop: true, volume: 0.1 })
        };

        function updateUI() {
            document.getElementById('dmxGame').innerText = dmxBalance.toFixed(2) + " DMX";
            document.getElementById('betValue').innerText = document.getElementById('betAmount').value + " DMX";
        }

        // 1️⃣, 2️⃣, 3️⃣ 3D & Asset Alignment
        function init3D() {
            const loader = new THREE.TextureLoader();
            const createScene = (id) => {
                const sc = new THREE.Scene();
                const re = new THREE.WebGLRenderer({alpha:true, antialias:true});
                re.setSize(300, 150); document.getElementById(id).appendChild(re.domElement);
                const ca = new THREE.PerspectiveCamera(45, 2/1, 0.1, 100); ca.position.z = 5;
                sc.add(new THREE.AmbientLight(0xffffff, 2));
                return {sc, re, ca};
            };

            // Coin 3D
            const c = createScene('coinCanvas');
            const coinMats = [
                new THREE.MeshStandardMaterial({color: 0xd4af37}), 
                new THREE.MeshStandardMaterial({map: loader.load('assets/heads.png')}), 
                new THREE.MeshStandardMaterial({map: loader.load('assets/tails.png')})
            ];
            coinMesh = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.3, 32), coinMats);
            coinMesh.rotation.x = Math.PI/2;
            c.sc.add(coinMesh);

            // Dice 3D
            const d = createScene('diceCanvas');
            const diceMats = [1,2,3,4,5,6].map(n => new THREE.MeshStandardMaterial({map: loader.load(`assets/dice${n}.png`)}));
            diceMesh = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), diceMats);
            d.sc.add(diceMesh);

            const animate = () => {
                requestAnimationFrame(animate);
                if(!isPlaying) { coinMesh.rotation.y += 0.01; diceMesh.rotation.x += 0.01; }
                c.re.render(c.sc, c.ca); d.re.render(d.sc, d.ca);
            };
            animate();
        }

        function playGame(type) {
            const bet = parseInt(document.getElementById('betAmount').value);
            if(dmxBalance < bet || isPlaying) return;
            isPlaying = true; dmxBalance -= bet; currentBet = bet; updateUI();

            if(type === 'coin') {
                // 2️⃣ Coin Flip Result Fix
                const result = Math.random() > 0.5 ? "Heads" : "Tails";
                const win = result === selectedSides.coin;
                const rot = result === "Heads" ? 0 : Math.PI;
                gsap.to(coinMesh.rotation, { 
                    y: coinMesh.rotation.y + 10, 
                    x: Math.PI/2 + rot, 
                    duration: 2, 
                    onComplete: () => finalize(win, bet, 1.9) 
                });
            } else if(type === 'dice') {
                // 3️⃣ Dice Face Alignment Fix
                const res = Math.floor(Math.random()*6)+1;
                const rotations = { 1:[0,0], 2:[0,Math.PI/2], 3:[0,-Math.PI/2], 4:[Math.PI/2,0], 5:[-Math.PI/2,0], 6:[Math.PI,0] };
                gsap.to(diceMesh.rotation, { 
                    x: rotations[res][0] + (Math.PI*4), 
                    y: rotations[res][1] + (Math.PI*4), 
                    duration: 2, 
                    onComplete: () => finalize(res === selectedSides.dice, bet, 5) 
                });
            } else if(type === 'slot') {
                // 6️⃣ Slot Reset Bug Fix
                gsap.set("#reel1, #reel2, #reel3", {y:0});
                const res = [Math.floor(Math.random()*6), Math.floor(Math.random()*6), Math.floor(Math.random()*6)];
                [1,2,3].forEach((id, i) => {
                    gsap.to(`#reel${id}`, { y: -1600 - (res[i]*80), duration: 2+i, onComplete: () => {
                        if(id===3) finalize(res[0]===res[1] && res[1]===res[2], bet, 10);
                    }});
                });
            } else if(type === 'crash') {
                startCrash(bet);
            } else if(type === 'battle') {
                setTimeout(() => finalize(Math.random() > 0.5, bet, 1.8), 1000);
            }
        }

        function startCrash(bet) {
            document.getElementById('crashBtn').classList.add('hidden');
            document.getElementById('cashoutBtn').classList.remove('hidden');
            currentCrash = 1.0;
            const crashPoint = (Math.random() * 5 + 1).toFixed(2);
            
            // 5️⃣ Crash Fire Trail Animation
            gsap.to("#rocket", { textShadow: "0 0 20px orange", repeat: -1, yoyo: true, duration: 0.2 });

            crashInterval = setInterval(() => {
                currentCrash += 0.05;
                document.getElementById('crashMult').innerText = currentCrash.toFixed(2) + "x";
                
                // 4️⃣ Crash Rocket Smooth Flight Fix
                gsap.to("#rocket", { 
                    x: (currentCrash-1)*140, 
                    y: -(currentCrash-1)*60, 
                    duration: 0.1, 
                    ease: "linear" 
                });

                if(currentCrash >= crashPoint) {
                    clearInterval(crashInterval);
                    finalize(false, bet, 0);
                    document.getElementById('crashBtn').classList.remove('hidden');
                    document.getElementById('cashoutBtn').classList.add('hidden');
                    gsap.killTweensOf("#rocket");
                }
            }, 100);
        }

        function cashoutCrash() {
            clearInterval(crashInterval);
            document.getElementById('crashBtn').classList.remove('hidden');
            document.getElementById('cashoutBtn').classList.add('hidden');
            finalize(true, currentBet, currentCrash);
        }

        function finalize(won, bet, mult) {
            isPlaying = false;
            if(won) {
                dmxBalance += (bet * mult);
                sounds.win.play();
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            } else {
                sounds.lose.play();
            }
            updateUI();
        }

        function openGame(g) { 
            document.getElementById('lobbyScreen').style.display = 'none'; 
            document.getElementById(g + 'Game').style.display = 'flex'; 
        }
        
        function backToLobby() { 
            document.getElementById('lobbyScreen').style.display = 'grid'; 
            document.querySelectorAll('.game-screen').forEach(s => s.style.display = 'none'); 
        }

        function setSide(g, v) { 
            selectedSides[g] = v; 
            document.querySelectorAll(`[id^="${g}"]`).forEach(b => b.classList.remove('active-selection')); 
            document.getElementById(g + v).classList.add('active-selection'); 
        }

        function toggleAmbience() {
            if(sounds.ambience.playing()) {
                sounds.ambience.stop();
                document.getElementById('muteBtn').innerText = "🔈 OFF";
            } else {
                sounds.ambience.play();
                document.getElementById('muteBtn').innerText = "🔊 ON";
            }
        }

        window.onload = () => {
            init3D();
            updateUI();
            // Slot reels setup
            [1,2,3].forEach(id => {
                const r = document.getElementById(`reel${id}`);
                for(let i=0; i<50; i++) {
                    const d = document.createElement('div');
                    d.className = 'h-[80px] flex items-center justify-center text-3xl';
                    d.innerText = ['💎','💰','7️⃣','🔔','👑','⚡'][i%6];
                    r.appendChild(d);
                }
            });
        };
    </script>
</body>
</html>
