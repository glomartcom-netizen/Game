<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMX Master - Final Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --primary: #6366f1; --dark-bg: #030712; }
        body { background: var(--dark-bg); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .master-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 2rem; }
        .stats-badge { background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2); color: #818cf8; transition: 0.3s; }
        .btn-master { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); transition: 0.3s; }
        .btn-master:disabled { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .loading-spinner { border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid white; border-radius: 50%; width: 14px; height: 14px; animation: spin 0.8s linear infinite; display: inline-block; margin-right: 6px; vertical-align: middle; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .active-selection { border: 2px solid var(--primary) !important; background: rgba(99, 102, 241, 0.15) !important; }
        input:disabled { opacity: 0.5; cursor: not-allowed; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #312e81; border-radius: 10px; }
    </style>
</head>
<body class="p-4 lg:p-12">

    <header class="max-w-7xl mx-auto mb-12 flex flex-col md:flex-row justify-between items-center gap-6">
        <div>
            <h1 class="text-4xl font-black tracking-tighter italic">DMX <span class="text-indigo-500">MASTER</span></h1>
            <div class="flex gap-4 mt-2">
                <span class="stats-badge px-3 py-1 rounded-full text-[10px] font-bold uppercase transition-colors" id="netStatus">Initializing...</span>
                <span class="stats-badge px-3 py-1 rounded-full text-[10px] font-bold uppercase hidden" id="chainLabel">BSC MAINNET</span>
                <span class="stats-badge px-3 py-1 rounded-full text-[10px] font-bold uppercase" id="jackpotDisplay">Jackpot: Syncing...</span>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="hidden sm:block text-right">
                <p class="text-[10px] text-slate-500 font-bold uppercase">Safe Balance</p>
                <p id="userBalance" class="text-xl font-mono font-bold text-indigo-400">0.00 DMX</p>
            </div>
            <button id="connectBtn" class="btn-master px-8 py-3 rounded-2xl font-black text-sm uppercase">Connect Wallet</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-8">
            <section class="master-card p-8">
                <h2 class="text-2xl font-bold mb-8">⚔️ Battle Arena</h2>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <button id="side0" onclick="setSide(0)" class="py-8 master-card border-2 border-transparent active-selection font-black text-2xl">ALPHA</button>
                    <button id="side1" onclick="setSide(1)" class="py-8 master-card border-2 border-transparent font-black text-2xl">OMEGA</button>
                </div>
                <div class="flex flex-col sm:flex-row gap-4">
                    <input id="betAmount" type="number" min="100" max="50000" placeholder="Min 100 DMX" class="flex-1 bg-black/40 border border-white/5 p-5 rounded-2xl outline-none focus:border-indigo-500 font-mono">
                    <button id="betBtn" onclick="executeBet()" class="btn-master px-12 py-5 rounded-2xl font-black text-lg">PLACE BET</button>
                </div>
            </section>
        </div>

        <div class="lg:col-span-4">
            <div class="master-card p-6 h-[500px] flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-indigo-400 italic text-xs uppercase">Live Pipeline</h3>
                    <button onclick="document.getElementById('eventFeed').innerHTML=''" class="text-[9px] text-slate-500 hover:text-white uppercase tracking-tighter">Clear Feed</button>
                </div>
                <div id="eventFeed" class="space-y-4 overflow-y-auto flex-1 text-[11px] font-mono scroll-smooth"></div>
            </div>
        </div>
    </main>

    <script>
        let walletProvider, signer, account, activeRPC, arenaContract;
        let selectedSide = 0, isProcessing = false;

        const ADDR = { arena: "0x...", dmx: "0x..." };
        const LIMITS = { MIN: 100, MAX: 50000, FEED: 30 };
        const RPC_ENDPOINTS = [
            "https://bsc-dataseed.binance.org/",
            "https://bsc-dataseed1.defibit.io/",
            "https://rpc.ankr.com/bsc"
        ];

        async function fetchWithTimeout(promise, ms = 3500) {
            const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout")), ms));
            return Promise.race([promise, timeout]);
        }

        async function checkRPCHealth() {
            const statusEl = document.getElementById('netStatus');
            for (let url of RPC_ENDPOINTS) {
                try {
                    const tempProvider = new ethers.JsonRpcProvider(url);
                    await fetchWithTimeout(tempProvider.getNetwork());
                    
                    // 1️⃣ Global Guard: Recreate only if RPC actually changes
                    if (activeRPC && activeRPC._getServerUrl() === url) return true;
                    
                    activeRPC = tempProvider;
                    statusEl.innerText = "RPC: ONLINE";
                    statusEl.classList.remove("text-red-400", "text-yellow-400");
                    statusEl.classList.add("text-green-400");
                    
                    startPublicListener();
                    return true;
                } catch (e) { console.warn(`Node fail: ${url}`); }
            }
            statusEl.innerText = "RPC: OFFLINE";
            statusEl.classList.replace("text-green-400", "text-red-400");
            return false;
        }

        function startPublicListener() {
            if (!activeRPC) return;
            try {
                if (arenaContract) arenaContract.removeAllListeners("BetPlaced");
                
                arenaContract = new ethers.Contract(ADDR.arena, ["event BetPlaced(address indexed player, uint256 amount, uint8 side)"], activeRPC);
                
                arenaContract.on("BetPlaced", (player, amount, side) => {
                    const time = new Date().toLocaleTimeString([], { hour12: false });
                    const div = document.createElement('div');
                    div.className = "p-3 border-l-2 border-indigo-500 bg-white/5 rounded-r-lg animate-pulse";
                    div.innerHTML = `<span class="text-slate-500">[${time}]</span> <span class="text-indigo-400 font-bold">${player.slice(0,6)}</span> bet <span class="text-white">${ethers.formatEther(amount)} DMX</span> on ${side === 0 ? 'ALPHA' : 'OMEGA'}`;
                    
                    const feed = document.getElementById('eventFeed');
                    feed.prepend(div);
                    feed.scrollTop = 0;
                    
                    setTimeout(() => div.classList.remove("animate-pulse"), 3000);
                    if (feed.children.length > LIMITS.FEED) feed.removeChild(feed.lastChild);
                });
            } catch (e) { console.error("Listener error", e); }
        }

        async function connectWallet() {
            const btn = document.getElementById('connectBtn');
            const chainLabel = document.getElementById('chainLabel');
            if (!window.ethereum) return alert("Install MetaMask");
            
            try {
                walletProvider = new ethers.BrowserProvider(window.ethereum);
                const network = await walletProvider.getNetwork();
                
                if (network.chainId !== 56n) {
                    await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x38" }] });
                }
                
                signer = await walletProvider.getSigner();
                account = await signer.getAddress();
                
                btn.innerText = `${account.slice(0,6)}...${account.slice(-4)}`;
                btn.disabled = true; 
                btn.classList.replace("btn-master", "stats-badge");
                
                // 4️⃣ Show Chain Label
                chainLabel.classList.remove('hidden');
                
                updateBalance();
            } catch (e) { alert(e.reason || e.message || "Connection Failed"); }
        }

        async function executeBet() {
            const amountInput = document.getElementById('betAmount');
            const amountStr = amountInput.value;
            const valNum = Number(amountStr);

            if (!valNum || valNum < LIMITS.MIN || valNum > LIMITS.MAX) return alert("Check Bet Limits!");
            if (!signer) return connectWallet();
            if (isProcessing) return;

            const btn = document.getElementById('betBtn');
            const originalText = btn.innerText;

            try {
                isProcessing = true;
                btn.disabled = true;
                // 3️⃣ Disable Input during Tx
                amountInput.disabled = true;
                btn.innerHTML = `<span class="loading-spinner"></span> SIGNING...`;

                const dmx = new ethers.Contract(ADDR.dmx, ["function approve(address,uint256) returns(bool)", "function allowance(address,address) view returns(uint256)", "function balanceOf(address) view returns(uint256)"], signer);
                const valWei = ethers.parseEther(amountStr);

                const balance = await dmx.balanceOf(account);
                if (balance < valWei) throw new Error("Insufficient DMX balance");

                const allowance = await dmx.allowance(account, ADDR.arena);
                if (allowance < valWei) {
                    btn.innerHTML = `<span class="loading-spinner"></span> APPROVING...`;
                    await (await dmx.approve(ADDR.arena, valWei)).wait();
                }

                const arena = new ethers.Contract(ADDR.arena, ["function bet(uint8,uint256)"], signer);
                
                // 5️⃣ Gas Estimation Fallback
                let gasLimit;
                try {
                    const gas = await arena.bet.estimateGas(selectedSide, valWei);
                    gasLimit = (gas * 130n) / 100n;
                } catch(e) {
                    console.warn("Gas estimation failed, using fallback");
                    gasLimit = 500000n; 
                }

                const tx = await arena.bet(selectedSide, valWei, { gasLimit });
                
                btn.innerHTML = `<span class="loading-spinner"></span> MINING...`;
                await tx.wait();
                updateBalance();
                alert("Bet Placed Successfully!");
            } catch (err) {
                // 2️⃣ Better Error Messages
                alert(err.reason || err.message || "Execution reverted");
            } finally {
                btn.innerHTML = `COOLDOWN...`;
                setTimeout(() => {
                    isProcessing = false;
                    btn.disabled = false;
                    // 3️⃣ Re-enable Input
                    amountInput.disabled = false;
                    btn.innerText = originalText;
                }, 3000);
            }
        }

        async function updateJackpot() {
            if (!activeRPC) return;
            try {
                const arena = new ethers.Contract(ADDR.arena, ["function jackpotPool() view returns(uint256)"], activeRPC);
                const pool = await arena.jackpotPool();
                document.getElementById('jackpotDisplay').innerText = `Jackpot: ${parseFloat(ethers.formatEther(pool)).toLocaleString()} DMX`;
            } catch (e) { console.log("Jackpot sync issue"); }
        }

        async function updateBalance() {
            if (!account || !activeRPC) return;
            try {
                const dmx = new ethers.Contract(ADDR.dmx, ["function balanceOf(address) view returns(uint256)"], activeRPC);
                const bal = await dmx.balanceOf(account);
                document.getElementById('userBalance').innerText = parseFloat(ethers.formatEther(bal)).toFixed(2) + " DMX";
            } catch (e) { console.log("Balance sync issue"); }
        }

        function setSide(s) {
            selectedSide = s;
            document.getElementById('side0').classList.toggle('active-selection', s === 0);
            document.getElementById('side1').classList.toggle('active-selection', s === 1);
        }

        window.onload = async () => {
            await checkRPCHealth();
            updateJackpot();
            setInterval(checkRPCHealth, 300000); 
            setInterval(updateJackpot, 20000); 
            
            if (window.ethereum) {
                window.ethereum.on("accountsChanged", () => location.reload());
                window.ethereum.on("chainChanged", () => location.reload());
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts.length > 0) connectWallet();
            }
        };

        document.getElementById('connectBtn').addEventListener('click', connectWallet);
    </script>
</body>
</html>
