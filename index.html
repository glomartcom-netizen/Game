<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DMX ELITE - V20.3 PREVIEW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script type="module">
        import { createAppKit } from 'https://esm.sh/@reown/appkit?bundle'
        import { Ethers5Adapter } from 'https://esm.sh/@reown/appkit-adapter-ethers5?bundle'
        import { bsc } from 'https://esm.sh/@reown/appkit/networks?bundle'

        const projectId = '059cc242b0cc96ac9665c598b76ddc7b'; 

        const modal = createAppKit({
            adapters: [new Ethers5Adapter()],
            networks: [bsc],
            metadata: { name: 'DimeX Elite', url: window.location.origin, icons: ['https://i.ibb.co/HpqwGFqt/logo.png'] },
            projectId,
            features: { analytics: true }
        });

        window.appKitModal = modal;
        window.connectWallet = () => modal.open();
        modal.subscribeState(state => { if (state.isConnected) window.handleWalletConnected(); });
    </script>

    <style>
        :root { --primary: #6366f1; --dark: #020617; }
        body { background: var(--dark); color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        .master-card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 1.2rem; }
        .btn-master { background: linear-gradient(135deg,#6366f1 0%,#a855f7 100%); font-weight:800; transition:0.3s; text-transform:uppercase; border-radius:0.75rem; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
        .btn-master:active { transform: scale(0.95); }
        .active-selection { border:2px solid #6366f1!important; background:rgba(99,102,241,0.2)!important; }
        .reel-blur { filter:blur(4px); }
        .game-screen { display:none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        .slot-window { display:flex; gap:5px; justify-content:center; background:#000; padding:10px; border-radius:1rem; height:100px; border:1px solid #1e293b; overflow:hidden; }
        .reel-hd { width:60px; height:80px; overflow:hidden; position:relative; background:#0a0a0a; border-radius:8px; }
        .symbol-hd { height:80px; display:flex; align-items:center; justify-content:center; font-size:2rem; }
    </style>
</head>
<body class="p-2 md:p-4">
    <header class="max-w-7xl mx-auto mb-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black italic tracking-tighter">DMX <span class="text-indigo-500">V20.3</span></h1>
            <p class="text-[9px] text-slate-500 uppercase font-bold">DMX/USDT: <span id="dmxRate" class="text-green-400">Loading...</span></p>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleAmbience()" id="muteBtn" class="master-card px-3 py-1 text-[10px] text-slate-400">🔈 OFF</button>
            <div class="master-card px-4 py-1 text-right">
                <div id="dmxGame" class="text-xs font-bold text-indigo-400">0.00 DMX</div>
            </div>
            <button onclick="window.connectWallet()" id="connectBtn" class="btn-master px-4 py-2 text-[10px]">CONNECT</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-4 h-[80vh]">
        <div class="lg:col-span-3 space-y-4 flex flex-col">
            <section class="master-card p-4">
                <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-2"><span>BET AMOUNT</span><span id="betValue" class="text-indigo-400">10 DMX</span></div>
                <input id="betAmount" type="range" min="10" max="1000" value="10" oninput="updateUI()" class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer mb-4">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="handleDeposit()" class="bg-green-600/20 border border-green-500/50 p-2 rounded-lg text-[10px] font-bold hover:bg-green-500/40">DEPOSIT (MIN 100)</button>
                    <button onclick="handleWithdraw()" class="bg-indigo-600/20 border border-indigo-500/50 p-2 rounded-lg text-[10px] font-bold hover:bg-indigo-500/40">WITHDRAW</button>
                </div>
            </section>
            
            <section class="master-card p-4 text-center">
                <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">Affiliate Program (5%)</p>
                <div class="flex flex-col gap-2">
                    <input id="refLink" type="text" readonly value="Connect Wallet..." class="w-full bg-black/40 border border-white/10 rounded px-2 py-1 text-[9px] text-indigo-300 text-center">
                    <div class="flex justify-between items-center px-1">
                        <span class="text-[9px] text-slate-400">Earned: <span id="refEarnings" class="text-green-400">0.00</span> DMX</span>
                        <button onclick="claimReferral()" class="bg-indigo-500 px-3 py-1 rounded text-[9px] font-bold">CLAIM</button>
                    </div>
                </div>
            </section>

            <section class="master-card p-4 flex-1 overflow-hidden flex flex-col">
                <p class="text-[10px] font-bold text-indigo-500 uppercase mb-2">Live Logs</p>
                <div id="liveFeed" class="flex-1 overflow-y-auto space-y-1 text-[9px] font-mono"></div>
            </section>
        </div>

        <div class="lg:col-span-9 overflow-y-auto pr-1 relative">
            <div id="lobbyScreen" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <div onclick="openGame('coin')" class="master-card p-6 cursor-pointer hover:border-indigo-500 transition-all text-center">
                    <div class="text-4xl mb-2">🪙</div><p class="text-sm font-bold">COIN FLIP</p>
                </div>
                <div onclick="openGame('slot')" class="master-card p-6 cursor-pointer hover:border-indigo-500 transition-all text-center">
                    <div class="text-4xl mb-2">🎰</div><p class="text-sm font-bold">SLOTS</p>
                </div>
                <div onclick="openGame('crash')" class="master-card p-6 cursor-pointer hover:border-indigo-500 transition-all text-center">
                    <div class="text-4xl mb-2">🚀</div><p class="text-sm font-bold">CRASH</p>
                </div>
                <div onclick="openGame('dice')" class="master-card p-6 cursor-pointer hover:border-indigo-500 transition-all text-center">
                    <div class="text-4xl mb-2">🎲</div><p class="text-sm font-bold">DICE</p>
                </div>
                <div onclick="openGame('battle')" class="master-card p-6 cursor-pointer hover:border-indigo-500 transition-all text-center">
                    <div class="text-4xl mb-2">⚔️</div><p class="text-sm font-bold">BATTLE</p>
                </div>
            </div>

            <div id="coinGame" class="game-screen master-card p-4">
                <button onclick="backToLobby()" class="absolute top-4 left-4 text-[10px] text-indigo-400 font-bold">← BACK</button>
                <div id="coinCanvas" class="h-40 mb-4"></div>
                <div class="flex gap-4 mb-4">
                    <button onclick="setSide('coin', 0)" id="coin0" class="px-6 py-2 master-card active-selection text-xs">HEADS</button>
                    <button onclick="setSide('coin', 1)" id="coin1" class="px-6 py-2 master-card text-xs">TAILS</button>
                </div>
                <button onclick="playGame('coin')" class="btn-master w-64 py-4">FLIP</button>
            </div>

            <div id="slotGame" class="game-screen master-card p-4">
                <button onclick="backToLobby()" class="absolute top-4 left-4 text-[10px] text-indigo-400 font-bold">← BACK</button>
                <div class="slot-window mb-6">
                    <div class="reel-hd"><div id="reel1" class="absolute w-full"></div></div>
                    <div class="reel-hd"><div id="reel2" class="absolute w-full"></div></div>
                    <div class="reel-hd"><div id="reel3" class="absolute w-full"></div></div>
                </div>
                <button onclick="playGame('slot')" class="btn-master w-64 py-4">SPIN</button>
            </div>

            <div id="crashGame" class="game-screen master-card p-4">
                <button onclick="backToLobby()" class="absolute top-4 left-4 text-[10px] text-indigo-400 font-bold">← BACK</button>
                <div id="crashMult" class="text-6xl font-black text-indigo-500 mb-2">1.00x</div>
                <div id="rocket" class="text-5xl mb-8">🚀</div>
                <button id="crashBtn" onclick="playGame('crash')" class="btn-master w-64 py-4">TAKE OFF</button>
                <button id="cashoutBtn" onclick="cashoutCrash()" class="hidden bg-green-500 w-64 py-4 rounded-xl font-black">CASHOUT</button>
            </div>

            <div id="diceGame" class="game-screen master-card p-4">
                <button onclick="backToLobby()" class="absolute top-4 left-4 text-[10px] text-indigo-400 font-bold">← BACK</button>
                <div id="diceCanvas" class="h-40 mb-4"></div>
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <button onclick="setSide('dice', 1)" id="dice1" class="px-4 py-2 master-card active-selection">1</button>
                    <button onclick="setSide('dice', 2)" id="dice2" class="px-4 py-2 master-card">2</button>
                    <button onclick="setSide('dice', 3)" id="dice3" class="px-4 py-2 master-card">3</button>
                    <button onclick="setSide('dice', 4)" id="dice4" class="px-4 py-2 master-card">4</button>
                    <button onclick="setSide('dice', 5)" id="dice5" class="px-4 py-2 master-card">5</button>
                    <button onclick="setSide('dice', 6)" id="dice6" class="px-4 py-2 master-card">6</button>
                </div>
                <button onclick="playGame('dice')" class="btn-master w-64 py-4">ROLL</button>
            </div>

            <div id="battleGame" class="game-screen master-card p-4">
                <button onclick="backToLobby()" class="absolute top-4 left-4 text-[10px] text-indigo-400 font-bold">← BACK</button>
                <div class="flex justify-around items-center w-full max-w-md mb-4">
                    <div id="p1" class="text-6xl">⚔️</div><div class="text-xl font-bold italic">VS</div><div id="p2" class="text-6xl">🛡️</div>
                </div>
                <div class="flex gap-4 mb-4">
                    <button onclick="setSide('battle',0)" id="battle0" class="px-6 py-2 master-card active-selection text-xs font-bold">WARRIOR</button>
                    <button onclick="setSide('battle',1)" id="battle1" class="px-6 py-2 master-card text-xs font-bold">PALADIN</button>
                </div>
                <button onclick="playGame('battle')" class="btn-master w-64 py-4">FIGHT</button>
            </div>
        </div>
    </main>

    <script>
        // --- Core Variables ---
        let dmxBalance = 0, referralBalance = 0, isPlaying = false, currentCrash = 1.0;
        let crashInterval, selectedSides = {coin:0, dice:1, battle:0}, inviter = null;
        let coinMesh, diceMesh, userAddress = null, ambienceOn = false;

        const sounds = {
            win: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-casino-bling-notification-229.mp3'] }),
            lose: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3'], volume: 0.2 }),
            spin: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-mechanical-spin-wheel-click-1139.mp3'], loop: true }),
            boom: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-explosive-impact-boom-2580.mp3'] }),
            ambience: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-casino-slot-machine-room-ambience-1982.mp3'], loop: true, volume: 0.05 })
        };

        // --- UPDATED: WALLET & UI LOGIC ---
        async function handleWalletConnected() {
            try {
                const provider = window.appKitModal.getWalletProvider();
                const ethersProvider = new ethers.BrowserProvider(provider);
                const signer = await ethersProvider.getSigner();
                userAddress = await signer.getAddress();
                
                const shortAddr = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
                const btn = document.getElementById("connectBtn");
                
                btn.innerText = shortAddr;
                btn.style.background = "linear-gradient(135deg,#10b981,#059669)";
                btn.style.color = "#fff";

                // Generate Referral Link
                const refCode = userAddress.slice(-6).toUpperCase();
                document.getElementById('refLink').value = window.location.origin + "?ref=" + refCode;
                
                const urlParams = new URLSearchParams(window.location.search);
                inviter = urlParams.get('ref');
                
                dmxBalance = 500.00; 
                updateUI();
                addLog("Wallet Connected: " + shortAddr, "text-green-400 font-bold");
            } catch (err) {
                addLog("Wallet Connection Failed", "text-red-500");
            }
        }

        async function fetchDMXRate() {
            const liveRate = (Math.random() * (0.050 - 0.045) + 0.045).toFixed(4);
            document.getElementById('dmxRate').innerText = liveRate + " USDT";
        }

        async function handleDeposit() {
            if(!userAddress) return window.connectWallet();
            const amount = prompt("Enter DMX Amount (Min 100):", "100");
            if(amount < 100) return alert("Minimum deposit is 100 DMX");
            addLog("Syncing with BSC Chain...", "text-yellow-500");
            setTimeout(() => {
                dmxBalance += parseFloat(amount);
                updateUI();
                addLog("Deposit Confirmed: +" + amount + " DMX", "text-green-400");
                confetti({ particleCount: 50 });
            }, 1000);
        }

        function handleWithdraw() {
            if(!userAddress) return window.connectWallet();
            if(dmxBalance < 100) return alert("Minimum withdrawal 100 DMX");
            addLog("Withdrawal Processing...", "text-yellow-500");
            setTimeout(() => { dmxBalance = 0; updateUI(); addLog("DMX Sent to Wallet", "text-indigo-400"); }, 1500);
        }

        function claimReferral() {
            if(referralBalance <= 0) return alert("No earnings to claim");
            dmxBalance += referralBalance;
            addLog("Claimed Reward: " + referralBalance.toFixed(2) + " DMX", "text-green-400");
            referralBalance = 0;
            updateUI();
        }

        function finalize(won, bet, mult) {
            isPlaying = false;
            if(won) {
                const winAmount = bet * mult;
                dmxBalance += winAmount;
                sounds.win.play();
                confetti({ particleCount: 150 });
                addLog(`WIN: +${winAmount.toFixed(2)} DMX`, "text-green-400 font-bold");
                if(inviter) {
                    const commission = winAmount * 0.05;
                    referralBalance += commission;
                    addLog(`Ref Reward: ${commission.toFixed(2)} sent to ${inviter}`, "text-indigo-300");
                }
            } else {
                sounds.lose.play();
                addLog(`LOSS: -${bet} DMX`, "text-red-500");
            }
            updateUI();
        }

        // --- FROZEN ENGINE (3D & GAMEPLAY) ---
        function init3D() {
            const createScene = (id) => {
                const sc = new THREE.Scene();
                const re = new THREE.WebGLRenderer({alpha:true, antialias:true});
                re.setSize(200, 160); document.getElementById(id).appendChild(re.domElement);
                const ca = new THREE.PerspectiveCamera(50, 200/160, 0.1, 100); ca.position.z = 6;
                sc.add(new THREE.AmbientLight(0xffffff, 1.2));
                return {sc, re, ca};
            }
            const c = createScene('coinCanvas');
            coinMesh = new THREE.Mesh(new THREE.CylinderGeometry(2,2,0.4,32), new THREE.MeshStandardMaterial({color:0xfbbf24, metalness:0.7, roughness:0.2}));
            coinMesh.rotation.x = Math.PI/2; c.sc.add(coinMesh);
            const d = createScene('diceCanvas');
            diceMesh = new THREE.Mesh(new THREE.BoxGeometry(2.2,2.2,2.2), new THREE.MeshStandardMaterial({color:0x6366f1}));
            d.sc.add(diceMesh);
            const anim = () => {
                requestAnimationFrame(anim);
                if(!isPlaying) { coinMesh.rotation.y += 0.02; diceMesh.rotation.x += 0.01; diceMesh.rotation.y += 0.01; }
                c.re.render(c.sc, c.ca); d.re.render(d.sc, d.ca);
            };
            anim();
        }

        function openGame(g) {
            document.getElementById('lobbyScreen').style.display = 'none';
            document.querySelectorAll('.game-screen').forEach(s => s.style.display = 'none');
            document.getElementById(g + 'Game').style.display = 'flex';
        }

        function backToLobby() {
            if(isPlaying) return;
            document.querySelectorAll('.game-screen').forEach(s => s.style.display = 'none');
            document.getElementById('lobbyScreen').style.display = 'grid';
        }

        function playGame(type) {
            const bet = parseInt(document.getElementById('betAmount').value);
            if(dmxBalance < bet || isPlaying) return;
            isPlaying = true; dmxBalance -= bet; updateUI();

            if(type === 'coin') {
                gsap.to(coinMesh.rotation, { y: coinMesh.rotation.y + 20, duration: 1.5, onComplete: () => finalize(Math.random() > 0.5, bet, 2) });
            } else if(type === 'dice') {
                gsap.to(diceMesh.rotation, { x: "+=10", y: "+=10", duration: 1.5, onComplete: () => finalize(Math.floor(Math.random()*6)+1 === selectedSides.dice, bet, 5) });
            } else if(type === 'slot') {
                startSlot(bet);
            } else if(type === 'battle') {
                gsap.to("#p1", { x: 50, repeat: 5, yoyo: true, duration: 0.1 });
                gsap.to("#p2", { x: -50, repeat: 5, yoyo: true, duration: 0.1, onComplete: () => finalize(Math.random() > 0.5, bet, 1.8) });
            } else if(type === 'crash') {
                startCrash(bet);
            }
        }

        function startCrash(bet) {
            document.getElementById('crashBtn').classList.add('hidden');
            document.getElementById('cashoutBtn').classList.remove('hidden');
            currentCrash = 1.0;
            let limit = 1.1 + Math.random() * 4;
            crashInterval = setInterval(() => {
                currentCrash += 0.03;
                document.getElementById('crashMult').innerText = currentCrash.toFixed(2) + "x";
                gsap.set("#rocket", { y: -((currentCrash-1)*50) });
                if(currentCrash >= limit) { clearInterval(crashInterval); sounds.boom.play(); document.getElementById('crashBtn').classList.remove('hidden'); document.getElementById('cashoutBtn').classList.add('hidden'); finalize(false, bet, 0); }
            }, 60);
        }

        function cashoutCrash() { clearInterval(crashInterval); document.getElementById('crashBtn').classList.remove('hidden'); document.getElementById('cashoutBtn').classList.add('hidden'); finalize(true, parseInt(document.getElementById('betAmount').value), currentCrash); }

        function startSlot(bet) {
            sounds.spin.play();
            const res = [Math.floor(Math.random()*6), Math.floor(Math.random()*6), Math.floor(Math.random()*6)];
            document.querySelectorAll('.reel-hd').forEach(r => r.classList.add('reel-blur'));
            [1,2,3].forEach((id, i) => {
                gsap.to(`#reel${id}`, { y: -1600 - (res[i]*80), duration: 2 + i, ease: "power4.inOut", onComplete: () => {
                    document.getElementById(`reel${id}`).parentElement.classList.remove('reel-blur');
                    if(id === 3) { sounds.spin.stop(); finalize(res[0] === res[1] && res[1] === res[2], bet, 10); }
                }});
            });
        }

        function updateUI() {
            document.getElementById('dmxGame').innerText = dmxBalance.toFixed(2) + " DMX";
            document.getElementById('refEarnings').innerText = referralBalance.toFixed(2);
            document.getElementById('betValue').innerText = document.getElementById('betAmount').value + " DMX";
        }

        function setSide(g, v) {
            selectedSides[g] = v;
            document.querySelectorAll(`[id^="${g}"]`).forEach(b => b.classList.remove('active-selection'));
            document.getElementById(g + v).classList.add('active-selection');
        }

        function toggleAmbience() {
            ambienceOn = !ambienceOn;
            ambienceOn ? sounds.ambience.play() : sounds.ambience.stop();
            document.getElementById('muteBtn').innerText = ambienceOn ? "🔊 ON" : "🔈 OFF";
        }

        function addLog(m, c) {
            const f = document.getElementById('liveFeed');
            const d = document.createElement('div'); d.className = c + " border-b border-white/5 pb-1";
            d.innerHTML = `<span class="opacity-30 mr-2">${new Date().toLocaleTimeString()}</span> ${m}`;
            f.prepend(d);
        }

        window.onload = () => {
            init3D(); updateUI(); fetchDMXRate();
            setInterval(fetchDMXRate, 10000);
            [1,2,3].forEach(id => {
                const r = document.getElementById(`reel${id}`);
                for(let i=0; i<30; i++) {
                    const d = document.createElement('div'); d.className='symbol-hd';
                    d.innerText = ['💎','💰','7️⃣','🔔','👑','⚡'][i%6]; r.appendChild(d);
                }
            });
        };
    </script>
</body>
</html>
