<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DMX ELITE - V26.5 STABILITY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script type="module">
        import { createAppKit } from 'https://esm.sh/@reown/appkit?bundle'
        import { Ethers5Adapter } from 'https://esm.sh/@reown/appkit-adapter-ethers5?bundle'
        import { bsc } from 'https://esm.sh/@reown/appkit/networks?bundle'

        const projectId = '059cc242b0cc96ac9665c598b76ddc7b';
        const modal = createAppKit({
          adapters: [new Ethers5Adapter()],
          networks: [bsc],
          metadata: { name: 'DimeX Pro', url: window.location.origin, icons: ['https://i.ibb.co/HpqwGFqt/logo.png'] },
          projectId,
          features: { analytics: true }
        });
        window.appKitModal = modal;

        modal.subscribeState(async (state) => {
            if(state.isConnected && window.syncWallet) await window.syncWallet();
        });
    </script>

    <style>
        :root { --primary: #6366f1; --dark: #020617; }
        body { background: var(--dark); color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        .master-card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 1.2rem; }
        .btn-master { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); font-weight: 800; transition: 0.2s; text-transform: uppercase; border-radius: 0.75rem; }
        .reel-blur { filter: blur(8px); }
        .game-screen { display: none; }
        #winOverlay { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 50; background: radial-gradient(circle, rgba(245, 158, 11, 0.6) 0%, transparent 70%); }
        .slot-window { display: flex; gap: 5px; justify-content: center; background: #000; padding: 10px; border-radius: 1rem; height: 100px; border: 1px solid #1e293b; overflow: hidden; }
        .reel-hd { width: 60px; height: 80px; overflow: hidden; position: relative; background: #0a0a0a; border-radius: 8px; }
        .symbol-hd { height: 80px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        
        #rocket { position: relative; z-index: 20; }
        #rocket::after {
            content:'';
            position:absolute;
            width:10px;
            height:50px;
            background:linear-gradient(transparent, #f97316, #fbbf24);
            left:50%;
            top:55px;
            transform:translateX(-50%);
            opacity:0;
            transition: opacity 0.3s;
            filter: blur(2px);
            border-radius: 50%;
        }
        .flying #rocket::after { opacity: 0.8; }
    </style>
</head>
<body id="mainBody" class="p-2 md:p-4">
    <div id="winOverlay"></div>

    <header class="max-w-7xl mx-auto mb-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black italic tracking-tighter text-white">DMX <span class="text-indigo-500">V26.5</span></h1>
            <p class="text-[9px] text-slate-500 uppercase font-bold"><span id="networkName">BSC NETWORK</span> | <span id="walletAddr" class="text-indigo-400">DEMO MODE</span></p>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleAmbience()" id="muteBtn" class="master-card px-3 py-1 text-[10px] text-slate-400">🔈 OFF</button>
            <div class="master-card px-4 py-1 text-right">
                <div id="dmxGame" class="text-xs font-bold text-indigo-400">500.00 DMX</div>
            </div>
            <button id="walletBtn" onclick="connectWallet()" class="btn-master px-4 py-2 text-[10px]">CONNECT WALLET</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-4 h-[78vh]">
        <div class="lg:col-span-3 space-y-4 flex flex-col">
            <section class="master-card p-4">
                <div class="flex justify-between text-[10px] font-bold text-slate-500 uppercase mb-2">
                    <span>Stake</span>
                    <span id="betValue" class="text-indigo-400">10 DMX</span>
                </div>
                <input id="betAmount" type="range" min="1" max="1000" value="10" oninput="updateUI()" class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer mb-6">
                
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="handleDeposit()" class="bg-green-600/20 border border-green-500/50 p-2 rounded-lg text-[10px] font-bold">DEPOSIT</button>
                    <button onclick="handleWithdraw()" class="bg-indigo-600/20 border border-indigo-500/50 p-2 rounded-lg text-[10px] font-bold">WITHDRAW</button>
                </div>
                
                <div id="refContainer" class="mt-4 p-2 bg-black/20 rounded border border-white/5 hidden">
                    <p class="text-[8px] text-slate-500 uppercase mb-1 font-bold">Your Referral Link</p>
                    <div id="refBox" class="text-[9px] text-indigo-400 font-mono break-all cursor-pointer bg-black/40 p-1 rounded">---</div>
                </div>
            </section>
            
            <section class="master-card p-4 flex-1 overflow-hidden flex flex-col">
                <p class="text-[10px] font-bold text-indigo-500 uppercase mb-2">Network Feed</p>
                <div id="liveFeed" class="flex-1 overflow-y-auto space-y-1 text-[9px] font-mono"></div>
            </section>
        </div>

        <div class="lg:col-span-9 overflow-y-auto pr-1">
            <div id="lobbyScreen" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <div onclick="openGame('coin')" class="master-card p-3 cursor-pointer hover:border-yellow-500 transition-all">
                    <div class="h-24 bg-yellow-500/10 rounded-lg mb-2 flex items-center justify-center text-4xl">🪙</div>
                    <p class="text-center text-xs font-bold uppercase">3D Coin Flip</p>
                </div>
                <div onclick="openGame('dice')" class="master-card p-3 cursor-pointer hover:border-blue-500 transition-all">
                    <div class="h-24 bg-blue-500/10 rounded-lg mb-2 flex items-center justify-center text-4xl">🎲</div>
                    <p class="text-center text-xs font-bold uppercase">Provable Dice</p>
                </div>
                <div onclick="openGame('crash')" class="master-card p-3 cursor-pointer hover:border-green-500 transition-all">
                    <div class="h-24 bg-green-500/10 rounded-lg mb-2 flex items-center justify-center text-4xl">🚀</div>
                    <p class="text-center text-xs font-bold uppercase">Turbo Crash</p>
                </div>
                <div onclick="openGame('slot')" class="master-card p-3 cursor-pointer hover:border-red-500 transition-all">
                    <div class="h-24 bg-red-500/10 rounded-lg mb-2 flex items-center justify-center text-4xl">🎰</div>
                    <p class="text-center text-xs font-bold uppercase">Elite Slots</p>
                </div>
                <div onclick="openGame('battle')" class="master-card p-3 cursor-pointer hover:border-indigo-500 transition-all">
                    <div class="h-24 bg-indigo-500/10 rounded-lg mb-2 flex items-center justify-center text-4xl">⚔️</div>
                    <p class="text-center text-xs font-bold uppercase">Battle Arena</p>
                </div>
            </div>

            <div id="coinGame" class="game-screen master-card p-6 flex flex-col items-center">
                <button onclick="backToLobby()" class="self-start text-[10px] text-indigo-400 mb-4 font-bold">← EXIT</button>
                <div id="coinCanvas" class="w-full h-40"></div>
                <button onclick="playGame('coin')" class="btn-master w-full max-w-md py-4 mt-6">Flip</button>
            </div>
            <div id="diceGame" class="game-screen master-card p-6 flex flex-col items-center">
                <button onclick="backToLobby()" class="self-start text-[10px] text-indigo-400 mb-4 font-bold">← EXIT</button>
                <div id="diceCanvas" class="w-full h-40"></div>
                <button onclick="playGame('dice')" class="btn-master w-full max-w-md py-4 mt-6">Roll</button>
            </div>
            <div id="crashGame" class="game-screen master-card p-6 flex flex-col">
                <button onclick="backToLobby()" class="self-start text-[10px] text-indigo-400 mb-4 font-bold">← EXIT</button>
                <div id="crashContainer" class="flex justify-between items-center mb-8 p-10 rounded-xl transition-all relative overflow-hidden h-64 bg-black/40">
                    <h3 id="crashMult" class="text-7xl font-black text-indigo-400 z-10 select-none">1.00x</h3>
                    <div id="rocket" class="text-7xl absolute left-10 bottom-2">🚀</div>
                </div>
                <button onclick="playGame('crash')" id="crashBtn" class="btn-master w-full py-5">TAKE OFF</button>
                <button onclick="cashoutCrash()" id="cashoutBtn" class="hidden w-full py-5 bg-green-600 rounded-xl font-black">CASHOUT</button>
            </div>
            <div id="slotGame" class="game-screen master-card p-6 flex flex-col items-center">
                <button onclick="backToLobby()" class="self-start text-[10px] text-indigo-400 mb-4 font-bold">← EXIT</button>
                <div id="slotDisplay" class="slot-window mb-6 w-full max-w-sm">
                    <div class="reel-hd"><div id="reel1" class="absolute w-full"></div></div>
                    <div class="reel-hd"><div id="reel2" class="absolute w-full"></div></div>
                    <div class="reel-hd"><div id="reel3" class="absolute w-full"></div></div>
                </div>
                <button onclick="playGame('slot')" id="slotBtn" class="btn-master w-full max-w-sm py-5">SPIN</button>
            </div>
            <div id="battleGame" class="game-screen master-card p-6 flex flex-col items-center">
                <button onclick="backToLobby()" class="self-start text-[10px] text-indigo-400 mb-4 font-bold">← EXIT</button>
                <div class="flex justify-around items-center w-full h-40 bg-black/40 rounded-xl mb-6 text-7xl">
                    <div id="p1">⚔️</div><div class="text-xl font-bold opacity-30">VS</div><div id="p2">🛡️</div>
                </div>
                <button onclick="playGame('battle')" class="btn-master w-full max-w-md py-4">FIGHT</button>
            </div>
        </div>
    </main>

    <script>
        const DMX_ADDR = "0xYourTokenAddress"; 
        const DMX_ABI = ["function balanceOf(address) view returns (uint256)", "function decimals() view returns (uint8)", "function deposit(uint256 amount, address referrer) public", "function withdraw(uint256 amount) public"];

        let demoMode = true;
        let dmxBalance = 500; 
        let userWallet = null, isPlaying = false, ambienceOn = false;
        let lockedBet = 10, nonce = 0, activeContract;
        let coinMesh, diceMesh, crashInt, crashVal;
        let currentRate = 100;

        async function connectWallet(){ await window.appKitModal.open(); }

        window.syncWallet = async () => {
            try {
                const provider = new ethers.BrowserProvider(window.appKitModal.getWalletProvider());
                const signer = await provider.getSigner();
                userWallet = await signer.getAddress();
                demoMode = false; 

                const network = await provider.getNetwork();
                document.getElementById("networkName").innerText = "CHAIN ID: " + network.chainId;
                document.getElementById("walletAddr").innerText = userWallet.slice(0,6)+"..."+userWallet.slice(-4);
                document.getElementById("walletBtn").innerText = "CONNECTED";
                
                const refLink = window.location.origin + "?ref=" + userWallet;
                document.getElementById("refBox").innerText = refLink;
                document.getElementById("refContainer").classList.remove("hidden");

                activeContract = new ethers.Contract(DMX_ADDR, DMX_ABI, signer);
                const rawBal = await activeContract.balanceOf(userWallet);
                dmxBalance = parseFloat(ethers.formatUnits(rawBal, 18));
                updateUI(); 
            } catch(e) { console.log(e); } 
        };

        async function fetchPancakeRate(){
            try{
                const res = await fetch("https://api.dexscreener.com/latest/dex/pairs/bsc/0x0000000000000000000000000000000000000000");
                const data = await res.json();
                currentRate = 1 / parseFloat(data.pair.priceUsd); 
            } catch(err){ currentRate = 100; }
        }

        async function handleDeposit(){
            const dmxAmount = prompt("Enter DMX amount to deposit");
            if(!dmxAmount || isNaN(dmxAmount)) return;

            const mode = prompt("Payment Mode: Type 'DMX' or 'USDT'").toUpperCase();
            const referrer = localStorage.getItem("dmx_ref");

            if(mode === "DMX"){
                addLog(`Deposit ${dmxAmount} DMX initiated`, "text-green-400");
            } else if(mode === "USDT"){
                const usdtAmount = (dmxAmount / currentRate).toFixed(4);
                addLog(`Pay ${usdtAmount} USDT → Receive ${dmxAmount} DMX`, "text-yellow-400");
            } else {
                alert("Invalid Payment Mode"); return;
            }

            dmxBalance += Number(dmxAmount);
            if(referrer && referrer !== userWallet) addLog(`Referral reward applied`, "text-indigo-400");
            updateUI();
        }

        async function handleWithdraw(){
            const amount = prompt("Enter amount to withdraw (DMX)");
            if(amount && !isNaN(amount) && amount <= dmxBalance){
                dmxBalance -= Number(amount);
                addLog(`Withdrawal of ${amount} DMX processed`, "text-indigo-400");
                updateUI();
            }
        }

        const sounds = {
            click: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-modern-technology-select-3124.mp3'] }),
            win: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-casino-bling-notification-229.mp3'] }),
            jackpot: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-claps-and-cheers-for-a-winning-performance-2070.mp3'] }),
            rocket: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-rocket-launcher-firing-1681.mp3'], loop: true }),
            cracker: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-firecracker-bang-2794.mp3'] }),
            lose: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3'] }),
            spin: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-mechanical-spin-wheel-click-1139.mp3'], loop: true }),
            boom: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-explosive-impact-boom-2580.mp3'] }),
            dice: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-dice-roll-on-a-table-923.mp3'] }),
            coin: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-light-metal-notification-2661.mp3'] }),
            fight: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-sword-strike-flesh-hit-2333.mp3'] }),
            casino: new Howl({ src: ['https://assets.mixkit.co/sfx/preview/mixkit-casino-slot-machine-room-ambience-1982.mp3'], loop: true, volume: 0.15 })
        };

        async function getProvableResult(max) {
            const combined = `DMX-SECRET-${userWallet || 'anon'}-${nonce++}`;
            const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(combined));
            const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
            return (parseInt(hashHex.substring(0, 8), 16) % max) + 1;
        }

        async function playGame(type) {
            lockedBet = parseInt(document.getElementById('betAmount').value);
            if(dmxBalance < lockedBet) return;
            if(isPlaying) return;
            isPlaying = true; dmxBalance -= lockedBet; updateUI();

            if(type === 'coin') {
                sounds.coin.play();
                const win = (await getProvableResult(100)) > 50;
                gsap.to(coinMesh.rotation, { y: coinMesh.rotation.y + (win ? 20*Math.PI : 21*Math.PI), duration: 2, onComplete: () => finalize(win, 2) });
            } else if(type === 'dice') {
                sounds.dice.play();
                const res = await getProvableResult(6);
                const faceMap = { 1:[0,0], 2:[0, Math.PI/2], 3:[Math.PI/2, 0], 4:[-Math.PI/2, 0], 5:[0, -Math.PI/2], 6:[Math.PI, 0] };
                gsap.to(diceMesh.rotation, { x: "+=15", y: "+=15", duration: 1.5, onComplete: () => {
                    gsap.set(diceMesh.rotation, { x: faceMap[res][0], y: faceMap[res][1] });
                    finalize(res >= 4, 2);
                }});
            } else if(type === 'crash') {
                document.getElementById('crashBtn').classList.add('hidden');
                document.getElementById('cashoutBtn').classList.remove('hidden');
                document.getElementById('crashContainer').classList.add('flying');
                sounds.rocket.play();
                gsap.killTweensOf("#rocket");
                gsap.set("#rocket", { x: 0, y: 0, scale: 1, rotation: 0 });
                gsap.to("#rocket", { rotation: 4, yoyo: true, repeat: -1, duration: 0.12, ease: "sine.inOut" });
                let t = 0; const boom = (await getProvableResult(500) / 100) + 1.1;
                const container = document.getElementById("crashContainer");
                gsap.to("#rocket", { duration: boom * 2, x: container.clientWidth - 120, y: -260, ease: "power1.in" });
                clearInterval(crashInt);
                crashInt = setInterval(() => {
                    t += 0.05; crashVal = Math.pow(Math.E, t/10);
                    document.getElementById('crashMult').innerText = crashVal.toFixed(2) + "x";
                    if(crashVal >= boom) {
                        clearInterval(crashInt); sounds.rocket.stop(); sounds.boom.play();
                        gsap.killTweensOf("#rocket");
                        document.getElementById('crashContainer').classList.remove('flying');
                        document.getElementById('cashoutBtn').classList.add('hidden');
                        document.getElementById('crashBtn').classList.remove('hidden');
                        finalize(false, 0);
                    }
                }, 50); 
            } else if(type === 'slot') {
                sounds.spin.play(); document.getElementById('slotDisplay').classList.add('reel-blur');
                const r = [await getProvableResult(6)-1, await getProvableResult(6)-1, await getProvableResult(6)-1];
                [1,2,3].forEach((id, i) => {
                    gsap.to(`#reel${id}`, { y: -2000, duration: 2+i, onComplete: () => {
                        gsap.set(`#reel${id}`, { y: -(r[i]*80) });
                        if(id === 3) { 
                            sounds.spin.stop(); 
                            document.getElementById('slotDisplay').classList.remove('reel-blur'); 
                            const isJackpot = r[0]===r[1] && r[1]===r[2];
                            if(isJackpot) sounds.jackpot.play();
                            finalize(isJackpot, 15); 
                        }
                    }});
                });
            } else if(type === 'battle') {
                const win = (await getProvableResult(100)) > 50;
                gsap.to("#p1", { x: 50, duration: 0.1, yoyo: true, repeat: 5 });
                gsap.to("#p2", { x: -50, duration: 0.1, yoyo: true, repeat: 5, onComplete: () => {
                    sounds.fight.play(); finalize(win, 2);
                }});
            }
        }

        function cashoutCrash() { 
            clearInterval(crashInt); sounds.rocket.stop(); gsap.killTweensOf("#rocket");
            document.getElementById('crashContainer').classList.remove('flying');
            finalize(true, crashVal); 
            document.getElementById('cashoutBtn').classList.add('hidden'); 
            document.getElementById('crashBtn').classList.remove('hidden'); 
        }

        function finalize(won, mult) {
            isPlaying = false;
            if(won) {
                const win = lockedBet * mult; dmxBalance += win;
                sounds.win.play(); sounds.cracker.play();
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                addLog(`WIN: +${win.toFixed(2)} DMX`, "text-green-400 font-bold");
            } else { sounds.lose.play(); addLog(`LOSS: -${lockedBet} DMX`, "text-red-500"); }
            updateUI();
        }

        function init3D() {
            const loader = new THREE.TextureLoader();
            const diceTex = loader.load("https://i.imgur.com/IaUrttj.png");
            const setup = (id, mesh) => {
                const sc = new THREE.Scene(); const re = new THREE.WebGLRenderer({alpha:true, antialias:true});
                const container = document.getElementById(id);
                re.setSize(container.clientWidth, container.clientHeight); container.appendChild(re.domElement);
                sc.add(new THREE.AmbientLight(0xffffff, 1.2), mesh);
                const ca = new THREE.PerspectiveCamera(50, container.clientWidth/container.clientHeight, 0.1, 100); ca.position.z = 6;
                const anim = () => { requestAnimationFrame(anim); if(!isPlaying) mesh.rotation.y += 0.01; re.render(sc, ca); };
                anim();
            };
            coinMesh = new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,0.3,64), [new THREE.MeshStandardMaterial({color:0xFFD700}), new THREE.MeshStandardMaterial({map:loader.load("https://upload.wikimedia.org/wikipedia/commons/1/1f/US_Quarter_Obverse.png")}), new THREE.MeshStandardMaterial({map:loader.load("https://upload.wikimedia.org/wikipedia/commons/6/6f/US_Quarter_Reverse.png")})]);
            coinMesh.rotation.x = Math.PI/2;
            diceMesh = new THREE.Mesh(new THREE.BoxGeometry(2.2,2.2,2.2), new THREE.MeshStandardMaterial({map:diceTex}));
            setup('coinCanvas', coinMesh); setup('diceCanvas', diceMesh);
        }

        function updateUI() {
            document.getElementById('dmxGame').innerText = dmxBalance.toFixed(2) + " DMX";
            document.getElementById('betValue').innerText = document.getElementById('betAmount').value + " DMX";
        }
        function openGame(g) { sounds.click.play(); document.getElementById('lobbyScreen').style.display='none'; document.getElementById(g+'Game').style.display='flex'; }
        function backToLobby() { sounds.click.play(); document.querySelectorAll('.game-screen').forEach(s=>s.style.display='none'); document.getElementById('lobbyScreen').style.display='grid'; }
        function addLog(m, c) {
            const f = document.getElementById('liveFeed'); const e = document.createElement('div'); 
            e.className = `pb-1 border-b border-white/5 ${c}`;
            e.innerHTML = `<span class="opacity-20 mr-1">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span> ${m}`;
            f.prepend(e);
        }
        function toggleAmbience() { ambienceOn = !ambienceOn; ambienceOn ? sounds.casino.play() : sounds.casino.stop(); document.getElementById('muteBtn').innerText = ambienceOn ? "🔊 ON" : "🔈 OFF"; }
        
        window.onload = () => {
            setTimeout(() => { init3D(); }, 300);
            fetchPancakeRate(); setInterval(fetchPancakeRate, 30000); 

            const ref = new URLSearchParams(window.location.search).get('ref');
            if(ref) localStorage.setItem("dmx_ref", ref);

            [1,2,3].forEach(id => {
                const r = document.getElementById(`reel${id}`);
                for(let i=0; i<30; i++) {
                    const d = document.createElement('div'); d.className='symbol-hd'; 
                    d.innerText = ['💎','💰','7️⃣','🔔','👑','⚡'][i%6]; r.appendChild(d);
                }
            });
        };
    </script>
</body>
</html>
